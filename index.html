</div>

<script>

const canvas = document.getElementById("gameCanvas");

const ctx = canvas.getContext("2d");

const scoreDisplay =
    document.getElementById("score-display");

const restartButton =
    document.getElementById("restart-button");


// ===============================
// GAME STATE
// ===============================

let score = 0;

let gameOver = false;

let spawnTimer = 0;

let frame = 0;

let screenShake = 0;


// ===============================
// LANES
// ===============================

const lanes = [35, 125, 215];


// ===============================
// COWBOY
// ===============================

const cowboy = {

    x: 45,

    y: lanes[1],

    width: 32,

    height: 55,

    lane: 1,

    isLassoing: false,

    lassoTimer: 0,

    bounce: 0

};


// ===============================
// COWS
// ===============================

const cows = [];


// ===============================
// PARTICLES
// ===============================

const particles = [];


// ===============================
// SCORE POPUPS
// ===============================

const scorePopups = [];


// ===============================
// BACKGROUND OBJECTS
// ===============================

const cacti = [

    { x: 80, y: 230 },

    { x: 250, y: 245 },

    { x: 360, y: 225 }

];


const clouds = [

    { x: 50, y: 40, speed: 0.2 },

    { x: 220, y: 65, speed: 0.15 },

    { x: 350, y: 30, speed: 0.25 }

];


// ===============================
// PLAYER MOVEMENT
// ===============================

function movePlayer(direction) {

    if (gameOver) return;

    cowboy.lane += direction;

    cowboy.lane =
        Math.max(
            0,
            Math.min(2, cowboy.lane)
        );

    cowboy.y = lanes[cowboy.lane];

    cowboy.bounce = 5;

}


// ===============================
// LASSO
// ===============================

function triggerLasso() {

    if (gameOver) return;

    if (!cowboy.isLassoing) {

        cowboy.isLassoing = true;

        cowboy.lassoTimer = 18;

        checkLassoHit();

    }

}


// ===============================
// SPAWN COW
// ===============================

function spawnCow() {

    const lane =
        Math.floor(Math.random() * 3);

    const difficulty =
        Math.min(score / 100, 4);

    cows.push({

        x: canvas.width + 20,

        y: lanes[lane] + 10,

        width: 42,

        height: 32,

        lane: lane,

        speed:
            2.5 +
            Math.random() * 1.5 +
            difficulty * 0.3,

        legFrame: 0

    });

}


// ===============================
// LASSO COLLISION
// ===============================

function checkLassoHit() {

    const reach = 100;

    for (
        let i = cows.length - 1;
        i >= 0;
        i--
    ) {

        const cow = cows[i];

        if (cow.lane !== cowboy.lane) {
            continue;
        }

        const cowboyRight =
            cowboy.x + cowboy.width;

        const cowCenter =
            cow.x + cow.width / 2;

        if (
            cowCenter > cowboyRight &&
            cowCenter <
            cowboyRight + reach
        ) {

            cows.splice(i, 1);

            score += 10;

            scoreDisplay.innerText =
                `SCORE: ${score}`;

            createDust(
                cow.x,
                cow.y + cow.height
            );

            createScorePopup(
                cow.x,
                cow.y
            );

            screenShake = 5;

        }

    }

}


// ===============================
// DUST PARTICLES
// ===============================

function createDust(x, y) {

    for (let i = 0; i < 6; i++) {

        particles.push({

            x: x,

            y: y,

            size:
                2 + Math.random() * 4,

            speedX:
                -1 - Math.random() * 2,

            speedY:
                -Math.random() * 1.5,

            life: 25

        });

    }

}


// ===============================
// SCORE POPUP
// ===============================

function createScorePopup(x, y) {

    scorePopups.push({

        x: x,

        y: y,

        life: 40

    });

}


// ===============================
// UPDATE PARTICLES
// ===============================

function updateParticles() {

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const p = particles[i];

        p.x += p.speedX;

        p.y += p.speedY;

        p.speedY += 0.05;

        p.life--;

        if (p.life <= 0) {

            particles.splice(i, 1);

        }

    }

}


// ===============================
// UPDATE SCORE POPUPS
// ===============================

function updateScorePopups() {

    for (
        let i = scorePopups.length - 1;
        i >= 0;
        i--
    ) {

        const popup =
            scorePopups[i];

        popup.y -= 0.7;

        popup.life--;

        if (popup.life <= 0) {

            scorePopups.splice(i, 1);

        }

    }

}


// ===============================
// UPDATE BACKGROUND
// ===============================

function updateBackground() {

    clouds.forEach(cloud => {

        cloud.x -= cloud.speed;

        if (cloud.x < -60) {

            cloud.x =
                canvas.width + 60;

        }

    });

    cacti.forEach(cactus => {

        cactus.x -= 1;

        if (cactus.x < -20) {

            cactus.x =
                canvas.width + 20;

        }

    });

}


// ===============================
// UPDATE GAME
// ===============================

function update() {

    if (gameOver) return;

    frame++;

    // Cowboy animation

    if (cowboy.bounce > 0) {

        cowboy.bounce--;

    }

    // Lasso animation

    if (cowboy.isLassoing) {

        cowboy.lassoTimer--;

        if (cowboy.lassoTimer <= 0) {

            cowboy.isLassoing = false;

        }

    }

    // Spawn cows

    spawnTimer++;

    const spawnRate =
        Math.max(
            55,
            90 - Math.floor(score / 50)
        );

    if (spawnTimer >= spawnRate) {

        spawnCow();

        spawnTimer = 0;

    }

    // Move cows

    for (
        let i = cows.length - 1;
        i >= 0;
        i--
    ) {

        const cow = cows[i];

        cow.x -= cow.speed;

        cow.legFrame++;

        // Create dust behind cow

        if (frame % 8 === 0) {

            createDust(
                cow.x + cow.width,
                cow.y + cow.height
            );

        }

        // Cow reaches left edge

        if (
            cow.x + cow.width < 0
        ) {

            gameOver = true;

            restartButton.style.display =
                "block";

        }

    }

    updateParticles();

    updateScorePopups();

    updateBackground();

    if (screenShake > 0) {

        screenShake--;

    }

}


// ===============================
// DRAW SKY
// ===============================

function drawSky() {

    ctx.fillStyle = "#9cb093";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    // Sun

    ctx.fillStyle = "#d6c96a";

    ctx.fillRect(
        315,
        25,
        35,
        35
    );

    // Mountains

    ctx.fillStyle = "#788875";

    ctx.beginPath();

    ctx.moveTo(0, 145);

    ctx.lineTo(70, 80);

    ctx.lineTo(130, 145);

    ctx.lineTo(200, 70);

    ctx.lineTo(280, 145);

    ctx.lineTo(340, 90);

    ctx.lineTo(400, 145);

    ctx.lineTo(400, 180);

    ctx.lineTo(0, 180);

    ctx.closePath();

    ctx.fill();

}


// ===============================
// DRAW CLOUDS
// ===============================

function drawClouds() {

    ctx.fillStyle =
        "rgba(255,255,255,0.35)";

    clouds.forEach(cloud => {

        ctx.fillRect(
            cloud.x,
            cloud.y,
            45,
            10
        );

        ctx.fillRect(
            cloud.x + 10,
            cloud.y - 6,
            20,
            10
        );

    });

}


// ===============================
// DRAW DESERT
// ===============================

function drawGround() {

    ctx.fillStyle = "#b5ad78";

    ctx.fillRect(
        0,
        165,
        canvas.width,
        135
    );

    // Road lines

    ctx.fillStyle =
        "rgba(70,60,40,0.18)";

    for (
        let x = -(frame % 40);
        x < canvas.width;
        x += 40
    ) {

        ctx.fillRect(
            x,
            270,
            20,
            3
        );

    }

}


// ===============================
// DRAW CACTI
// ===============================

function drawCacti() {

    ctx.fillStyle = "#506b4d";

    cacti.forEach(cactus => {

        ctx.fillRect(
            cactus.x,
            cactus.y,
            8,
            35
        );

        ctx.fillRect(
            cactus.x - 7,
            cactus.y + 10,
            7,
            5
        );

        ctx.fillRect(
            cactus.x + 8,
            cactus.y + 17,
            7,
            5
        );

    });

}


// ===============================
// DRAW LANES
// ===============================

function drawLanes() {

    ctx.strokeStyle =
        "rgba(0,0,0,0.15)";

    ctx.lineWidth = 2;

    lanes.forEach(y => {

        ctx.beginPath();

        ctx.moveTo(
            0,
            y + 60
        );

        ctx.lineTo(
            canvas.width,
            y + 60
        );

        ctx.stroke();

    });

}


// ===============================
// DRAW COWBOY
// ===============================

function drawCowboy() {

    const bounce =
        cowboy.bounce > 0
        ? -2
        : Math.sin(frame * 0.15) * 2;

    const x = cowboy.x;

    const y =
        cowboy.y + bounce;

    // Legs

    ctx.fillStyle = "#222";

    const legOffset =
        Math.sin(frame * 0.3) * 3;

    ctx.fillRect(
        x + 5,
        y + 40 + legOffset,
        7,
        15
    );

    ctx.fillRect(
        x + 20,
        y + 40 - legOffset,
        7,
        15
    );

    // Body

    ctx.fillStyle = "#2244aa";

    ctx.fillRect(
        x + 5,
        y + 18,
        22,
        25
    );

    // Head

    ctx.fillStyle = "#d69b65";

    ctx.fillRect(
        x + 8,
        y + 5,
        17,
        17
    );

    // Hat

    ctx.fillStyle = "#4a2c1a";

    ctx.fillRect(
        x + 5,
        y + 2,
        23,
        5
    );

    ctx.fillRect(
        x + 10,
        y - 3,
        14,
        6
    );

    // Face

    ctx.fillStyle = "#111";

    ctx.fillRect(
        x + 20,
        y + 11,
        3,
        3
    );

}


// ===============================
// DRAW COW
// ===============================

function drawCow(cow) {

    const bob =
        Math.sin(
            cow.legFrame * 0.2
        ) * 2;

    const x = cow.x;

    const y =
        cow.y + bob;

    // Legs

    ctx.fillStyle = "#3b2112";

    const leg =
        Math.sin(
            cow.legFrame * 0.35
        ) * 3;

    ctx.fillRect(
        x + 6,
        y + 23 + leg,
        6,
        12
    );

    ctx.fillRect(
        x + 28,
        y + 23 - leg,
        6,
        12
    );

    // Body

    ctx.fillStyle = "#5c2c16";

    ctx.fillRect(
        x + 5,
        y + 8,
        30,
        20
    );

    // Head

    ctx.fillRect(
        x + 30,
        y + 5,
        12,
        18
    );

    // Horns

    ctx.fillStyle = "#ddd";

    ctx.fillRect(
        x + 32,
        y + 1,
        5,
        5
    );

    ctx.fillRect(
        x + 39,
        y + 1,
        4,
        5
    );

    // Eye

    ctx.fillStyle = "#fff";

    ctx.fillRect(
        x + 38,
        y + 9,
        3,
        3
    );

}


// ===============================
// DRAW LASSO
// ===============================

function drawLasso() {

    if (!cowboy.isLassoing) {
        return;
    }

    const progress =
        1 -
        cowboy.lassoTimer / 18;

    const radius =
        15 +
        progress * 45;

    const centerX =
        cowboy.x +
        cowboy.width +
        25;

    const centerY =
        cowboy.y + 25;

    ctx.strokeStyle = "#e8e0bd";

    ctx.lineWidth = 4;

    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        radius,
        0,
        Math.PI * 2
    );

    ctx.stroke();

    // Rope connection

    ctx.beginPath();

    ctx.moveTo(
        cowboy.x + cowboy.width,
        cowboy.y + 25
    );

    ctx.lineTo(
        centerX - radius,
        centerY
    );

    ctx.stroke();

}


// ===============================
// DRAW PARTICLES
// ===============================

function drawParticles() {

    ctx.fillStyle =
        "rgba(120,100,70,0.6)";

    particles.forEach(p => {

        ctx.fillRect(
            p.x,
            p.y,
            p.size,
            p.size
        );

    });

}


// ===============================
// DRAW SCORE POPUPS
// ===============================

function drawScorePopups() {

    ctx.fillStyle = "#222";

    ctx.font =
        "bold 16px monospace";

    ctx.textAlign = "center";

    scorePopups.forEach(popup => {

        ctx.fillText(
            "+10",
            popup.x,
            popup.y
        );

    });

}


// ===============================
// DRAW GAME OVER
// ===============================

function drawGameOver() {

    if (!gameOver) return;

    ctx.fillStyle =
        "rgba(0,0,0,0.65)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle = "#fff";

    ctx.textAlign = "center";

    ctx.font =
        "bold 28px monospace";

    ctx.fillText(
        "GAME OVER",
        canvas.width / 2,
        135
    );

    ctx.font =
        "16px monospace";

    ctx.fillText(
        `SCORE: ${score}`,
        canvas.width / 2,
        165
    );

}


// ===============================
// DRAW EVERYTHING
// ===============================

function draw() {

    ctx.save();

    // Screen shake

    if (screenShake > 0) {

        const shakeX =
            (Math.random() - 0.5) *
            screenShake;

        const shakeY =
            (Math.random() - 0.5) *
            screenShake;

        ctx.translate(
            shakeX,
            shakeY
        );

    }

    drawSky();

    drawClouds();

    drawGround();

    drawCacti();

    drawLanes();

    drawCowboy();

    cows.forEach(cow => {

        drawCow(cow);

    });

    drawLasso();

    drawParticles();

    drawScorePopups();

    drawGameOver();

    ctx.restore();

}


// ===============================
// RESTART
// ===============================

function restartGame() {

    score = 0;

    gameOver = false;

    spawnTimer = 0;

    frame = 0;

    screenShake = 0;

    cows.length = 0;

    particles.length = 0;

    scorePopups.length = 0;

    cowboy.lane = 1;

    cowboy.y = lanes[1];

    cowboy.isLassoing = false;

    cowboy.lassoTimer = 0;

    scoreDisplay.innerText =
        "SCORE: 0";

    restartButton.style.display =
        "none";

}


// ===============================
// BUTTONS
// ===============================

document
    .getElementById("btn-up")
    .addEventListener(
        "touchstart",
        function(e) {

            e.preventDefault();

            movePlayer(-1);

        }
    );


document
    .getElementById("btn-down")
    .addEventListener(
        "touchstart",
        function(e) {

            e.preventDefault();

            movePlayer(1);

        }
    );


document
    .getElementById("btn-lasso")
    .addEventListener(
        "touchstart",
        function(e) {

            e.preventDefault();

            triggerLasso();

        }
    );


// Desktop controls

document
    .getElementById("btn-up")
    .addEventListener(
        "mousedown",
        () => movePlayer(-1)
    );


document
    .getElementById("btn-down")
    .addEventListener(
        "mousedown",
        () => movePlayer(1)
    );


document
    .getElementById("btn-lasso")
    .addEventListener(
        "mousedown",
        triggerLasso
    );


// Restart

restartButton.addEventListener(
    "click",
    restartGame
);


// ===============================
// KEYBOARD
// ===============================

window.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key === "ArrowUp"
        ) {

            e.preventDefault();

            movePlayer(-1);

        }

        if (
            e.key === "ArrowDown"
        ) {

            e.preventDefault();

            movePlayer(1);

        }

        if (
            e.key === " " ||
            e.key.toLowerCase() === "x"
        ) {

            e.preventDefault();

            triggerLasso();

        }

        if (
            e.key.toLowerCase() === "r" &&
            gameOver
        ) {

            restartGame();

        }

    }
);


// ===============================
// GAME LOOP
// ===============================

function loop() {

    update();

    draw();

    requestAnimationFrame(loop);

}


// Start game

loop();

</script>
