```
<div id="console-shell">

    <div id="solar-panel"></div>

    <div id="ui-bar">
        <span>RODEO-51</span>
        <span id="score-display">SCORE: 0</span>
    </div>

    <div id="screen-container">
        <canvas id="gameCanvas" width="400" height="300"></canvas>
    </div>

    <div id="controls">

        <div class="dpad">
            <button class="btn-move" id="btn-up">▲</button>
            <button class="btn-move" id="btn-down">▼</button>
        </div>

        <button class="btn-action" id="btn-lasso">LASSO</button>

    </div>

    <button id="restart-button">RESTART GAME</button>

</div>

<script>

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreDisplay = document.getElementById('score-display');
    const restartButton = document.getElementById('restart-button');

    // Game State
    let score = 0;
    let gameOver = false;
    let spawnTimer = 0;

    // Player
    const cowboy = {
        x: 40,
        y: 125,
        width: 30,
        height: 50,
        color: '#2222ff',
        lane: 1,
        isLassoing: false,
        lassoTimer: 0
    };

    // Fixed lanes
    const lanes = [25, 125, 225];

    // Enemies
    const cows = [];

    // Move Player
    function movePlayer(direction) {

        if (gameOver) return;

        cowboy.lane = Math.max(
            0,
            Math.min(2, cowboy.lane + direction)
        );

        cowboy.y = lanes[cowboy.lane];

    }

    // Lasso
    function triggerLasso() {

        if (gameOver) return;

        if (!cowboy.isLassoing) {

            cowboy.isLassoing = true;
            cowboy.lassoTimer = 10;

            checkLassoHit();

        }

    }

    // Spawn Cow
    function spawnCow() {

        const randomLane = Math.floor(Math.random() * 3);

        cows.push({

            x: canvas.width,
            y: lanes[randomLane] + 10,
            width: 40,
            height: 30,
            color: '#8b4513',
            lane: randomLane,
            speed: 3

        });

    }

    // Check Lasso Collision
    function checkLassoHit() {

        const lassoReach = 80;

        for (let i = cows.length - 1; i >= 0; i--) {

            const cow = cows[i];

            if (cow.lane === cowboy.lane) {

                const cowboyRight = cowboy.x + cowboy.width;
                const lassoRight = cowboyRight + lassoReach;

                const cowCenter = cow.x + cow.width / 2;

                if (
                    cowCenter > cowboyRight &&
                    cowCenter < lassoRight
                ) {

                    cows.splice(i, 1);

                    score += 10;

                    scoreDisplay.innerText = `SCORE: ${score}`;

                }

            }

        }

    }

    // Update Game
    function update() {

        if (gameOver) return;

        // Lasso animation timer
        if (cowboy.isLassoing) {

            cowboy.lassoTimer--;

            if (cowboy.lassoTimer <= 0) {
                cowboy.isLassoing = false;
            }

        }

        // Spawn cows
        spawnTimer++;

        if (spawnTimer % 90 === 0) {
            spawnCow();
        }

        // Move cows
        for (let i = cows.length - 1; i >= 0; i--) {

            cows[i].x -= cows[i].speed;

            // Game Over
            if (cows[i].x + cows[i].width < 0) {

                gameOver = true;

                restartButton.style.display = 'block';

            }

        }

    }

    // Draw Game
    function draw() {

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw lanes
        ctx.strokeStyle = 'rgba(0,0,0,0.15)';
        ctx.lineWidth = 4;

        lanes.forEach(y => {

            ctx.beginPath();
            ctx.moveTo(0, y + 50);
            ctx.lineTo(canvas.width, y + 50);
            ctx.stroke();

        });

        // Draw Cowboy
        ctx.fillStyle = cowboy.color;

        ctx.fillRect(
            cowboy.x,
            cowboy.y,
            cowboy.width,
            cowboy.height
        );

        // Draw Lasso
        if (cowboy.isLassoing) {

            ctx.fillStyle = '#ff1111';

            ctx.fillRect(
                cowboy.x + cowboy.width + 5,
                cowboy.y + 15,
                60,
                10
            );

        }

        // Draw Cows
        ctx.fillStyle = '#5c2c16';

        cows.forEach(cow => {

            ctx.fillRect(
                cow.x,
                cow.y,
                cow.width,
                cow.height
            );

        });

        // Game Over Screen
        if (gameOver) {

            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#fff';
            ctx.font = '24px monospace';
            ctx.textAlign = 'center';

            ctx.fillText(
                "GAME OVER",
                canvas.width / 2,
                canvas.height / 2
            );

            ctx.font = '14px monospace';

            ctx.fillText(
                "Press Restart",
                canvas.width / 2,
                canvas.height / 2 + 30
            );

        }

    }

    // Restart Game
    function restartGame() {

        score = 0;
        gameOver = false;
        spawnTimer = 0;

        cows.length = 0;

        cowboy.lane = 1;
        cowboy.y = lanes[cowboy.lane];

        cowboy.isLassoing = false;
        cowboy.lassoTimer = 0;

        scoreDisplay.innerText = "SCORE: 0";

        restartButton.style.display = 'none';

    }

    // Touch Controls
    document.getElementById('btn-up').addEventListener(
        'touchstart',
        (e) => {
            e.preventDefault();
            movePlayer(-1);
        }
    );

    document.getElementById('btn-down').addEventListener(
        'touchstart',
        (e) => {
            e.preventDefault();
            movePlayer(1);
        }
    );

    document.getElementById('btn-lasso').addEventListener(
        'touchstart',
        (e) => {
            e.preventDefault();
            triggerLasso();
        }
    );

    // Desktop Controls
    document.getElementById('btn-up').addEventListener(
        'mousedown',
        () => movePlayer(-1)
    );

    document.getElementById('btn-down').addEventListener(
        'mousedown',
        () => movePlayer(1)
    );

    document.getElementById('btn-lasso').addEventListener(
        'mousedown',
        triggerLasso
    );

    // Keyboard Controls
    window.addEventListener('keydown', (e) => {

        if (e.key === 'ArrowUp') {
            e.preventDefault();
            movePlayer(-1);
        }

        if (e.key === 'ArrowDown') {
            e.preventDefault();
            movePlayer(1);
        }

        if (e.key === ' ' || e.key.toLowerCase() === 'x') {
            e.preventDefault();
            triggerLasso();
        }

        if (e.key === 'r' && gameOver) {
            restartGame();
        }

    });

    // Restart Button
    restartButton.addEventListener(
        'click',
        restartGame
    );

    // Main Game Loop
    function loop() {

        update();
        draw();

        requestAnimationFrame(loop);

    }

    // Start Game
    loop();

</script>
