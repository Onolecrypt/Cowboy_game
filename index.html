<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retro Solar Rodeo</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: radial-gradient(circle at 50% 20%, #3a2e22 0%, #1c140d 75%);
        font-family: "Rockwell", "Roboto Slab", Georgia, serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
    }

    .console {
        width: 470px;
        background: linear-gradient(180deg, #ecd9ab 0%, #dfc48c 100%);
        border: 8px solid #b8934f;
        border-radius: 30px;
        padding: 18px;
        box-shadow:
            0 14px 0 #6e4a26,
            0 18px 24px rgba(0,0,0,0.45),
            inset 0 3px 0 #fbeecb;
        position: relative;
    }

    .console::before {
        content: "";
        position: absolute;
        left: 18px;
        right: 18px;
        top: 8px;
        height: 6px;
        background: repeating-linear-gradient(
            90deg,
            #c1502f 0 10px,
            #3f948a 10px 20px
        );
        border-radius: 3px;
        opacity: 0.85;
    }

    .brand {
        text-align: center;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 4px;
        color: #7a3418;
        margin: 8px 0 10px;
        text-shadow: 0 1px 0 rgba(255,255,255,0.4);
    }

    .brand .sun-glyph {
        color: #c1502f;
        margin: 0 4px;
    }

    .solar-panel {
        width: 100px;
        height: 26px;
        margin: 0 auto 12px;
        background: repeating-linear-gradient(
            90deg,
            #1c2f3a 0 11px,
            #35586a 11px 13px
        );
        border: 3px solid #16252d;
        border-radius: 2px;
        box-shadow: inset 0 4px 6px rgba(255,255,255,0.15);
    }

    .score-box {
        display: flex;
        justify-content: space-between;
        background: #3f2a18;
        color: #f0c98a;
        padding: 7px 8px;
        font-size: 10px;
        letter-spacing: 0.3px;
        border-radius: 6px 6px 0 0;
        border: 4px solid #2a1a0d;
        border-bottom: 0;
    }

    .screen-frame {
        background: #2a1a0d;
        padding: 9px;
        border: 4px solid #1a0f07;
        border-radius: 0 0 6px 6px;
    }

    canvas {
        width: 100%;
        height: auto;
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background: #d8c48f;
        border-radius: 2px;
    }

    .controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 20px;
        padding: 0 8px;
    }

    button {
        border: none;
        font-family: "Rockwell", "Roboto Slab", Georgia, serif;
        font-weight: bold;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
    }

    .dpad {
        display: grid;
        grid-template-columns: 42px 42px 42px;
        grid-template-rows: 38px 38px 38px;
        gap: 5px;
    }

    .dpad button {
        background: linear-gradient(180deg, #a8562f 0%, #8a3f22 100%);
        color: #f3ddb8;
        border: 4px solid #5c2a14;
        border-radius: 8px;
        font-size: 16px;
        box-shadow: 0 5px 0 #431e0f;
    }

    .dpad button:active {
        transform: translateY(4px);
        box-shadow: 0 1px 0 #431e0f;
    }

    #up { grid-column: 2; grid-row: 1; }
    #left { grid-column: 1; grid-row: 2; }
    #right { grid-column: 3; grid-row: 2; }
    #down { grid-column: 2; grid-row: 3; }

    .action-buttons {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
    }

    .lasso-button {
        width: 92px;
        height: 92px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #dd6a42 0%, #b3502f 55%, #8f3d24 100%);
        color: #fff3e2;
        border: 5px solid #3f948a;
        box-shadow: 0 6px 0 #5c2a14, inset 0 0 0 3px #6e2f18;
        font-size: 13px;
        letter-spacing: 1px;
    }

    .lasso-button:active {
        transform: translateY(5px);
        box-shadow: 0 1px 0 #5c2a14, inset 0 0 0 3px #6e2f18;
    }

    .start-button {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: linear-gradient(180deg, #a8562f 0%, #8a3f22 100%);
        color: #f3ddb8;
        border: 3px solid #5c2a14;
        box-shadow: 0 4px 0 #431e0f;
        font-size: 8.5px;
        letter-spacing: 0.5px;
    }

    .start-button:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #431e0f;
    }

    .hint {
        text-align: center;
        font-size: 9.5px;
        margin-top: 14px;
        color: #8a6a3f;
        letter-spacing: 1px;
    }
</style>
</head>

<body>

<div class="console">

    <div class="brand"><span class="sun-glyph">☀</span>SOLAR RODEO<span class="sun-glyph">☀</span></div>

    <div class="solar-panel"></div>

    <div class="score-box">
        <span>LVL <span id="level">1</span></span>
        <span>SCORE <span id="score">0000</span></span>
        <span>LIVES <span id="lives">3</span></span>
        <span>HI <span id="highScore">0000</span></span>
    </div>

    <div class="screen-frame">
        <canvas id="game" width="160" height="120"></canvas>
    </div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// -----------------------------------
// SOUND (synthesized, no audio files)
// -----------------------------------

let audioCtx = null;

function getAudioCtx() {

    try {

        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        if (audioCtx.state === "suspended") {
            audioCtx.resume();
        }

        return audioCtx;

    } catch (error) {
        return null;
    }
}

function playTone(freq, duration, type, volume, delay) {

    let ac = getAudioCtx();

    if (!ac) {
        return;
    }

    try {

        let osc = ac.createOscillator();
        let gain = ac.createGain();

        osc.type = type || "square";
        osc.frequency.value = freq;

        osc.connect(gain);
        gain.connect(ac.destination);

        let startTime = ac.currentTime + (delay || 0);
        let vol = volume || 0.15;

        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(vol, startTime + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

        osc.start(startTime);
        osc.stop(startTime + duration + 0.02);

    } catch (error) {
        // Audio unavailable — fail silently, gameplay unaffected.
    }
}

function playSequence(notes) {
    for (let n of notes) {
        playTone(n.freq, n.duration, n.type, n.volume, n.delay);
    }
}

function sfxThrow() {
    playTone(220, 0.07, "square", 0.12, 0);
}

function sfxCatch() {
    playSequence([
        { freq: 523, duration: 0.07, type: "square", volume: 0.15, delay: 0.13 },
        { freq: 784, duration: 0.12, type: "square", volume: 0.15, delay: 0.2 }
    ]);
}

function sfxMoo() {

    let ac = getAudioCtx();

    if (!ac) {
        return;
    }

    try {

        let now = ac.currentTime + 0.22;
        let duration = 1.0;

        // Two slightly detuned sawtooths for a rougher, less "clean synth"
        // tone, plus a sub-octave layer for body.

        let osc1 = ac.createOscillator();
        osc1.type = "sawtooth";

        let osc2 = ac.createOscillator();
        osc2.type = "sawtooth";
        osc2.detune.value = -16;

        let sub = ac.createOscillator();
        sub.type = "sine";

        // A resonant filter sweep is what actually reads as a vowel —
        // this is the "mmm" (closed, muffled) opening into "ooo"
        // (brighter) and closing again, which is the real shape of a moo.

        let formant = ac.createBiquadFilter();
        formant.type = "bandpass";
        formant.Q.value = 4;

        let gain = ac.createGain();
        let subGain = ac.createGain();
        subGain.gain.value = 0.45;

        // Vibrato

        let lfo = ac.createOscillator();
        lfo.type = "sine";
        lfo.frequency.value = 5.5;

        let lfoGain = ac.createGain();
        lfoGain.gain.value = 5;

        lfo.connect(lfoGain);
        lfoGain.connect(osc1.frequency);
        lfoGain.connect(osc2.frequency);

        // A little low-rate tremolo for roughness/growl

        let growl = ac.createOscillator();
        growl.type = "sine";
        growl.frequency.value = 24;

        let growlGain = ac.createGain();
        growlGain.gain.value = 0.15;

        growl.connect(growlGain);
        growlGain.connect(gain.gain);

        osc1.connect(formant);
        osc2.connect(formant);
        formant.connect(gain);

        sub.connect(subGain);
        subGain.connect(gain);

        gain.connect(ac.destination);

        // Pitch: a low, slightly rising-then-falling moan

        let baseFreq = 125;

        osc1.frequency.setValueAtTime(baseFreq, now);
        osc1.frequency.linearRampToValueAtTime(baseFreq * 1.15, now + 0.22);
        osc1.frequency.linearRampToValueAtTime(baseFreq * 0.82, now + duration);

        osc2.frequency.setValueAtTime(baseFreq, now);
        osc2.frequency.linearRampToValueAtTime(baseFreq * 1.15, now + 0.22);
        osc2.frequency.linearRampToValueAtTime(baseFreq * 0.82, now + duration);

        sub.frequency.setValueAtTime(baseFreq / 2, now);
        sub.frequency.linearRampToValueAtTime(baseFreq * 0.82 / 2, now + duration);

        // Formant sweep: closed "mmm" -> open "ooo" -> closing "mmm"

        formant.frequency.setValueAtTime(450, now);
        formant.frequency.linearRampToValueAtTime(1700, now + 0.28);
        formant.frequency.linearRampToValueAtTime(1300, now + duration * 0.6);
        formant.frequency.linearRampToValueAtTime(400, now + duration);

        // Amplitude: swells as the mouth opens, fades as it closes

        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.15, now + 0.1);
        gain.gain.linearRampToValueAtTime(0.2, now + 0.32);
        gain.gain.linearRampToValueAtTime(0.11, now + duration * 0.75);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        osc1.start(now);
        osc2.start(now);
        sub.start(now);
        lfo.start(now);
        growl.start(now);

        osc1.stop(now + duration + 0.05);
        osc2.stop(now + duration + 0.05);
        sub.stop(now + duration + 0.05);
        lfo.stop(now + duration + 0.05);
        growl.stop(now + duration + 0.05);

    } catch (error) {
        // Audio unavailable — fail silently, gameplay unaffected.
    }
}


let mooAudioEl = document.getElementById("moo-audio");
let mooAudioFailed = false;

if (mooAudioEl) {
    mooAudioEl.addEventListener("error", () => {
        mooAudioFailed = true;
    });
    mooAudioEl.volume = 0.6;
}

function playRealMoo() {

    if (!mooAudioEl || mooAudioFailed) {
        sfxMoo();
        return;
    }

    try {

        mooAudioEl.currentTime = 0;

        let playResult = mooAudioEl.play();

        if (playResult && typeof playResult.catch === "function") {
            playResult.catch(() => {
                sfxMoo();
            });
        }

    } catch (error) {
        sfxMoo();
    }
}

    pixel(10, 20, 15, 8, LCD.mid);
    pixel(5, 24, 25, 6, LCD.mid);
    pixel(60, 18, 15, 8, LCD.mid);
    pixel(55, 22, 25, 6, LCD.mid);
    pixel(115, 21, 15, 7, LCD.mid);
    pixel(110, 25, 25, 5, LCD.mid);


    // Ground

    pixel(0, 30, 160, 90, LCD.light);


    // Scattered cacti (decorative, non-blocking)

    drawCactus(140, 40);
    drawCactus(70, 34);
    drawCactus(130, 96);


    // Fence posts marking the field edge

    for (let x = FIELD.left; x < FIELD.right; x += 18) {
        pixel(x, FIELD.top - 4, 2, 6, LCD.dark);
    }
}


function drawCactus(x, y) {

    pixel(x, y, 4, 16, LCD.dark);
    pixel(x - 4, y + 4, 4, 3, LCD.dark);
    pixel(x - 4, y + 4, 3, 7, LCD.dark);
    pixel(x + 4, y + 7, 4, 3, LCD.dark);
    pixel(x + 5, y + 7, 3, 6, LCD.dark);
}


// -----------------------------------
// HOME PEN
// -----------------------------------

function drawFencePost(px, py, h) {

    // Round-log post: dark shaft with a highlight strip
    // down one side to suggest roundness and height.

    pixel(px - 1, py - h, 3, h, LCD.darkest);
    pixel(px - 1, py - h, 1, h, LCD.mid);
}


function drawPen() {

    let postH = 7;

    // Cast shadow — grounds the pen against the field

    pixel(PEN.x + 2, PEN.y + 3, PEN.width, PEN.height, "rgba(40,26,14,0.3)");

    // Floor

    pixel(PEN.x, PEN.y, PEN.width, PEN.height, LCD.mid);

    // Worn dirt streaks for texture

    pixel(PEN.x + 4, PEN.y + 8, PEN.width - 9, 1, LCD.dark);
    pixel(PEN.x + 6, PEN.y + 17, PEN.width - 13, 1, LCD.dark);

    // Top rail

    pixel(PEN.x, PEN.y - 2, PEN.width, 2, LCD.darkest);
    pixel(PEN.x, PEN.y - 2, PEN.width, 1, LCD.mid);

    // Side rails

    pixel(PEN.x - 1, PEN.y, 2, PEN.height, LCD.darkest);
    pixel(PEN.x + PEN.width - 1, PEN.y, 2, PEN.height, LCD.darkest);

    // Bottom rail, with a gate gap left open

    let gateStart = PEN.x + PEN.width * 0.38;
    let gateEnd = PEN.x + PEN.width * 0.62;

    pixel(PEN.x, PEN.y + PEN.height, gateStart - PEN.x, 2, LCD.darkest);
    pixel(gateEnd, PEN.y + PEN.height, PEN.x + PEN.width - gateEnd, 2, LCD.darkest);

    // Posts at corners, edge midpoints, and flanking the gate

    drawFencePost(PEN.x, PEN.y, postH);
    drawFencePost(PEN.x + PEN.width, PEN.y, postH);
    drawFencePost(PEN.x + PEN.width / 2, PEN.y, postH * 0.8);

    drawFencePost(PEN.x, PEN.y + PEN.height / 2, postH * 0.7);
    drawFencePost(PEN.x + PEN.width, PEN.y + PEN.height / 2, postH * 0.7);

    drawFencePost(PEN.x, PEN.y + PEN.height, postH);
    drawFencePost(PEN.x + PEN.width, PEN.y + PEN.height, postH);

    drawFencePost(gateStart, PEN.y + PEN.height, postH * 0.85);
    drawFencePost(gateEnd, PEN.y + PEN.height, postH * 0.85);
}


function isInPen(x, y) {

    return (
        x > PEN.x &&
        x < PEN.x + PEN.width &&
        y > PEN.y &&
        y < PEN.y + PEN.height
    );
}


function keepOutsidePen(x, y, margin) {

    // Pushes a point back to the nearest edge outside the pen
    // (plus a margin for the fence itself), so entities that
    // shouldn't enter the pen can approach the fence line but
    // never overlap it.

    let left = PEN.x - margin;
    let right = PEN.x + PEN.width + margin;
    let top = PEN.y - margin;
    let bottom = PEN.y + PEN.height + margin;

    if (x <= left || x >= right || y <= top || y >= bottom) {
        return { x: x, y: y };
    }

    let distLeft = x - left;
    let distRight = right - x;
    let distTop = y - top;
    let distBottom = bottom - y;

    let minDist = Math.min(distLeft, distRight, distTop, distBottom);

    if (minDist === distLeft) {
        return { x: left, y: y };
    } else if (minDist === distRight) {
        return { x: right, y: y };
    } else if (minDist === distTop) {
        return { x: x, y: top };
    } else {
        return { x: x, y: bottom };
    }
}


function drawPennedCalves() {

    for (let pc of pennedCalves) {

        let animFrame = Math.floor(frame / 12 + pc.animOffset) % 4;

        drawAnimal(pc.x, pc.y, 0.55, animFrame, LCD.dark, "down");
    }
}


// -----------------------------------
// LASSO THROW ANIMATION
// -----------------------------------

function drawLasso() {

    if (cowboy.lassoTimer <= 0) {
        return;
    }

    let elapsed = 1 - cowboy.lassoTimer / 14;
    let dir = cowboy.lassoDir;

    let reach = 20;
    let loopDist = 6 + elapsed * (reach - 6);

    let loopX = cowboy.x + dir.x * loopDist;
    let loopY = cowboy.y + dir.y * loopDist;

    // Rope line from cowboy to the loop

    if (dir.x !== 0) {

        let ropeLen = Math.abs(loopX - cowboy.x);
        let ropeX = dir.x > 0 ? cowboy.x : loopX;

        pixel(ropeX, cowboy.y - 1, ropeLen, 1, LCD.darkest);

    } else {

        let ropeLen = Math.abs(loopY - cowboy.y);
        let ropeY = dir.y > 0 ? cowboy.y : loopY;

        pixel(cowboy.x - 1, ropeY, 1, ropeLen, LCD.darkest);
    }

    // Spinning loop at the end of the rope

    let points = 10;
    let radius = 3 + elapsed * 2;

    for (let i = 0; i < points; i++) {

        let angle = (Math.PI * 2 / points) * i + frame * 0.3;

        let px = loopX + Math.cos(angle) * radius;
        let py = loopY + Math.sin(angle) * radius;

        pixel(px, py, 1, 1, LCD.darkest);
    }
}


// -----------------------------------
// COWBOY
// -----------------------------------

function drawCowboy() {

    if (cowboy.invulnerable > 0 && Math.floor(frame / 4) % 2 === 0) {
        return;
    }

    let animation = Math.floor(frame / 5) % 4;
    let bob = [0, 1, 0, -1][animation];

    ctx.save();
    ctx.translate(cowboy.x, cowboy.y + bob);

    if (cowboy.facing === "left" || cowboy.facing === "right") {

        if (cowboy.facing === "left") {
            ctx.scale(-1, 1);
        }

        // Legs

        if (animation === 0 || animation === 2) {
            pixel(-4, 6, 2, 7, LCD.darkest);
            pixel(0, 7, 2, 6, LCD.darkest);
        } else {
            pixel(-5, 7, 2, 6, LCD.darkest);
            pixel(0, 6, 2, 7, LCD.darkest);
        }

        // Body

        pixel(-4, 0, 7, 8, LCD.dark);

        // Belt

        pixel(-4, 5, 7, 2, LCD.darkest);

        // Arm

        pixel(2, 1, 5, 2, LCD.darkest);
        pixel(6, 0, 2, 3, LCD.darkest);

        // Head

        pixel(-3, -5, 6, 6, LCD.darkest);

        // Nose

        pixel(3, -3, 3, 3, LCD.darkest);

        // Hat

        pixel(-5, -7, 11, 3, LCD.darkest);
        pixel(-2, -10, 6, 3, LCD.darkest);
        pixel(-1, -9, 4, 1, LCD.mid);

    } else {

        // Facing the viewer (down) or away (up) — symmetric pose.

        let faceVisible = cowboy.facing === "down";

        // Legs

        if (animation === 0 || animation === 2) {
            pixel(-3, 6, 2, 7, LCD.darkest);
            pixel(1, 7, 2, 6, LCD.darkest);
        } else {
            pixel(-3, 7, 2, 6, LCD.darkest);
            pixel(1, 6, 2, 7, LCD.darkest);
        }

        // Body

        pixel(-3, 0, 7, 8, LCD.dark);

        // Belt

        pixel(-3, 5, 7, 2, LCD.darkest);

        // Arms at sides

        pixel(-6, 1, 3, 2, LCD.darkest);
        pixel(3, 1, 3, 2, LCD.darkest);

        // Head

        pixel(-3, -5, 6, 6, LCD.darkest);

        if (faceVisible) {

            // Eyes

            pixel(-2, -3, 1, 1, LCD.light);
            pixel(1, -3, 1, 1, LCD.light);
        }

        // Hat

        pixel(-5, -7, 11, 3, LCD.darkest);
        pixel(-3, -10, 6, 3, LCD.darkest);
        pixel(-2, -9, 4, 1, LCD.mid);
    }

    ctx.restore();
}


// -----------------------------------
// CALF / BULL SPRITE (shared, scaled)
// -----------------------------------

function drawAnimal(x, y, scale, animFrame, bodyColor, facing) {

    let bob = [0, 1, 0, -1][animFrame];

    ctx.save();
    ctx.translate(x, y + bob);

    if (facing === "left" || facing === "right") {

        // Base artwork faces left (head on the left side), so mirror
        // it when the animal is actually moving/facing right.

        if (facing === "right") {
            ctx.scale(-1, 1);
        }

        ctx.scale(scale, scale);

        // Legs

        if (animFrame === 0) {
            pixel(1, 6, 3, 8, bodyColor);
            pixel(8, 7, 3, 7, bodyColor);
        } else if (animFrame === 1) {
            pixel(0, 7, 3, 7, bodyColor);
            pixel(9, 5, 3, 9, bodyColor);
        } else if (animFrame === 2) {
            pixel(2, 7, 3, 7, bodyColor);
            pixel(8, 6, 3, 8, bodyColor);
        } else {
            pixel(0, 5, 3, 9, bodyColor);
            pixel(9, 7, 3, 7, bodyColor);
        }

        // Body

        pixel(0, 0, 12, 9, bodyColor);
        pixel(2, -1, 8, 2, bodyColor);

        // Head

        pixel(-4, 0, 6, 8, LCD.darkest);
        pixel(-7, 3, 4, 4, LCD.darkest);

        // Ear

        pixel(-3, -2, 4, 3, bodyColor);

        // Horns

        pixel(-5, -2, 2, 3, LCD.darkest);
        pixel(-2, -3, 2, 2, LCD.darkest);

        // Eye

        pixel(-3, 2, 1, 1, LCD.light);

        // Tail

        pixel(12, 0, 2, 6, LCD.darkest);
        pixel(13, 5, 3, 2, LCD.darkest);

    } else {

        // Facing the viewer (down) or away (up) — symmetric pose.

        ctx.scale(scale, scale);

        let faceVisible = facing === "down";

        // Legs (front or hind pair, close together)

        if (animFrame === 0 || animFrame === 2) {
            pixel(-4, 7, 3, 7, bodyColor);
            pixel(2, 8, 3, 6, bodyColor);
        } else {
            pixel(-4, 8, 3, 6, bodyColor);
            pixel(2, 7, 3, 7, bodyColor);
        }

        // Body

        pixel(-6, 0, 12, 9, bodyColor);
        pixel(-4, -1, 8, 2, bodyColor);

        // Head

        pixel(-3, -4, 6, 6, LCD.darkest);

        if (faceVisible) {

            // Horns

            pixel(-4, -6, 2, 2, LCD.darkest);
            pixel(2, -6, 2, 2, LCD.darkest);

            // Eyes

            pixel(-2, -2, 1, 1, LCD.light);
            pixel(1, -2, 1, 1, LCD.light);

        } else {

            // Ears peeking from behind

            pixel(-4, -5, 2, 2, bodyColor);
            pixel(2, -5, 2, 2, bodyColor);

            // Tail hanging down the back

            pixel(-1, -2, 2, 7, LCD.darkest);
        }
    }

    ctx.restore();
}


function drawCalf(calf) {

    let animFrame = Math.floor(frame / 6 + calf.animOffset) % 4;

    drawAnimal(calf.x, calf.y, 0.85, animFrame, LCD.dark, calf.facing);
}


function drawBull(bull) {

    let animFrame = Math.floor(frame / 4 + bull.animOffset) % 4;

    let dist = Math.hypot(bull.x - cowboy.x, bull.y - cowboy.y);
    let proximity = 1 - Math.max(0, Math.min(1, dist / 70));
    let scale = 1.1 + proximity * 0.5;

    drawAnimal(bull.x, bull.y, scale, animFrame, LCD.darkest, bull.facing);

    // Dust kicked up when charging, to sell the approach

    if (bull.state === "charge" && frame % 4 === 0) {
        createDust(bull.x + 8, bull.y + 10);
    }
}


// -----------------------------------
// DIFFICULTY BY LEVEL
// -----------------------------------

function levelCalfTotal(lvl) {
    return 4 + lvl * 2;
}


// -----------------------------------
// SPAWN CALF
// -----------------------------------

function spawnCalf() {

    let x = FIELD.left + 30 + Math.random() * (FIELD.right - FIELD.left - 40);
    let y = FIELD.top + Math.random() * (FIELD.bottom - FIELD.top);

    calves.push({
        x: x,
        y: y,
        vx: 0,
        vy: 0,
        facing: "down",
        wanderTimer: 0,
        animOffset: Math.random() * 4,
        carried: false,
        spookedTimer: 0,
        spookedBull: null
    });
}


function spawnBull() {

    // Spawn at whichever corner is farthest from the cowboy,
    // so it starts as a distant threat rather than on top of you.

    let corners = [
        { x: FIELD.left, y: FIELD.top },
        { x: FIELD.right, y: FIELD.top },
        { x: FIELD.left, y: FIELD.bottom },
        { x: FIELD.right, y: FIELD.bottom }
    ];

    let best = corners[0];
    let bestDist = -1;

    for (let c of corners) {

        let d = Math.hypot(c.x - cowboy.x, c.y - cowboy.y);

        if (d > bestDist) {
            bestDist = d;
            best = c;
        }
    }

    best = keepOutsidePen(best.x, best.y, 3);

    bulls.push({
        x: best.x,
        y: best.y,
        vx: 0,
        vy: 0,
        facing: "down",
        state: "wander",
        stateTimer: 60 + Math.random() * 40,
        animOffset: Math.random() * 4
    });
}


// -----------------------------------
// DUST
// -----------------------------------

function createDust(x, y) {

    for (let i = 0; i < 2; i++) {

        dust.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 0.6,
            vy: (Math.random() - 0.5) * 0.6,
            life: 15
        });
    }
}


function updateDust() {

    for (let i = dust.length - 1; i >= 0; i--) {

        let p = dust[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;

        if (p.life <= 0) {
            dust.splice(i, 1);
        }
    }
}


function drawDust() {

    for (let p of dust) {
        pixel(p.x, p.y, 2, 1, LCD.mid);
    }
}


// -----------------------------------
// POPUPS
// -----------------------------------

function createPopup(x, y, text) {

    popups.push({ x: x, y: y, life: 25, text: text });
}


function updatePopups() {

    for (let i = popups.length - 1; i >= 0; i--) {

        popups[i].y -= 0.4;
        popups[i].life--;

        if (popups[i].life <= 0) {
            popups.splice(i, 1);
        }

}


function drawPopups() {

    for (let p of popups) {

        ctx.fillStyle = LCD.darkest;
        ctx.font = "5px monospace";
        ctx.fillText(p.text, p.x, p.y);
    }
}


// -----------------------------------
// GAME OVER
// -----------------------------------

function endGame() {
    gameOver = true;
    sfxGameOver();
}


// -----------------------------------
// LASSO THROW
// -----------------------------------

function attemptLasso() {

    if (!gameStarted || gameOver || levelComplete) {
        return;
    }

    let dir = { x: 0, y: 0 };

    if (cowboy.facing === "left") dir = { x: -1, y: 0 };
    else if (cowboy.facing === "right") dir = { x: 1, y: 0 };
    else if (cowboy.facing === "up") dir = { x: 0, y: -1 };
    else dir = { x: 0, y: 1 };

    cowboy.lassoDir = dir;
    cowboy.lassoTimer = 14;

    sfxThrow();

    if (cowboy.carrying) {
        return;
    }

    let throwRange = 24;
    let bestCalf = null;
    let bestDist = throwRange;

    for (let calf of calves) {

        if (calf.carried) {
            continue;
        }

        let dx = calf.x - cowboy.x;
        let dy = calf.y - cowboy.y;
        let dist = Math.hypot(dx, dy);

        if (dist > throwRange || dist === 0) {
            continue;
        }

        // Must be roughly in the direction the cowboy is facing
        // (a forward cone, not a full circle) for the throw to land.

        let dot = (dx * dir.x + dy * dir.y) / dist;

        if (dot > 0.35 && dist < bestDist) {
            bestDist = dist;
            bestCalf = calf;
        }
    }

    if (bestCalf) {
        bestCalf.carried = true;
        cowboy.carrying = bestCalf;
        createDust(bestCalf.x, bestCalf.y + 6);
        sfxCatch();
        playRealMoo();
    }
}


// -----------------------------------
// UPDATE
// -----------------------------------

function update() {

    if (!gameStarted || gameOver || levelComplete) {
        return;
    }

    frame++;


    // ---- Cowboy movement ----

    let dx = 0;
    let dy = 0;

    if (keys.up) dy -= 1;
    if (keys.down) dy += 1;
    if (keys.left) dx -= 1;
    if (keys.right) dx += 1;

    if (dx !== 0) {
        cowboy.facing = dx > 0 ? "right" : "left";
    } else if (dy !== 0) {
        cowboy.facing = dy > 0 ? "down" : "up";
    }

    if (dx === 0 && dy === 0) {
        cowboy.idleTimer++;
    } else {
        cowboy.idleTimer = 0;
    }

    if (dx !== 0 && dy !== 0) {
        dx *= 0.7071;
        dy *= 0.7071;
    }

    let speed = cowboy.carrying ? 0.55 : 0.75;

    cowboy.x += dx * speed;
    cowboy.y += dy * speed;

    cowboy.x = Math.max(FIELD.left, Math.min(FIELD.right, cowboy.x));
    cowboy.y = Math.max(FIELD.top, Math.min(FIELD.bottom, cowboy.y));

    if (cowboy.invulnerable > 0) {
        cowboy.invulnerable--;
    }

    if (cowboy.lassoTimer > 0) {
        cowboy.lassoTimer--;
    }

    // After 5 seconds without moving (e.g. cornered by a bull),
    // nearby bulls back off to give the cowboy room.

    if (cowboy.idleTimer === 300) {

        for (let bull of bulls) {

            let d = Math.hypot(bull.x - cowboy.x, bull.y - cowboy.y);

            if (d < 35) {
                bull.state = "retreat";
                bull.stateTimer = 60;
            }
        }
    }


    // ---- Spawn calves (capped to this level's total) ----

    spawnTimer--;

    if (spawnTimer <= 0 && calvesSpawned < levelCalfTotal(level)) {

        let looseCalves = calves.filter(c => !c.carried).length;

        if (looseCalves < 3) {
            spawnCalf();
            calvesSpawned++;
        }

        spawnTimer = Math.max(50, 110 - score * 0.6);
    }


    // ---- Bulls ----

    if (bulls.length === 0) {
        spawnBull();
    }

    if (level >= 2 && bulls.length < 2) {
        spawnBull();
    }

    for (let bull of bulls) {

        let toX = cowboy.x - bull.x;
        let toY = cowboy.y - bull.y;
        let dist = Math.hypot(toX, toY) || 1;

        let detectionRadius = 55;

        bull.stateTimer--;

        if (bull.state === "retreat") {

            // Backing off to give the cowboy room after being
            // cornered too long.

            let awayX = bull.x - cowboy.x;
            let awayY = bull.y - cowboy.y;
            let awayDist = Math.hypot(awayX, awayY) || 1;
            let retreatSpeed = 0.4;

            bull.x += (awayX / awayDist) * retreatSpeed;
            bull.y += (awayY / awayDist) * retreatSpeed;

            if (Math.abs(awayX) > Math.abs(awayY)) {
                bull.facing = awayX > 0 ? "right" : "left";
            } else {
                bull.facing = awayY > 0 ? "down" : "up";
            }

            if (bull.stateTimer <= 0) {
                bull.state = "wander";
                bull.stateTimer = 70 + Math.random() * 50;
            }

        } else if (bull.state === "wander") {

            if (dist < detectionRadius && bull.stateTimer <= 0) {

                bull.state = "charge";
                bull.stateTimer = 55 + Math.random() * 20;

            } else if (bull.stateTimer <= 0) {

                let angle = Math.random() * Math.PI * 2;

                bull.vx = Math.cos(angle) * 0.2;
                bull.vy = Math.sin(angle) * 0.2;
                bull.stateTimer = 50 + Math.random() * 50;

                if (Math.abs(bull.vx) > Math.abs(bull.vy)) {
                    bull.facing = bull.vx > 0 ? "right" : "left";
                } else {
                    bull.facing = bull.vy > 0 ? "down" : "up";
                }
            }

            bull.x += bull.vx;
            bull.y += bull.vy;

        } else {

            // Charging: home toward the cowboy at higher speed.

            let chargeSpeed = 0.55 + score * 0.006;

            bull.x += (toX / dist) * chargeSpeed;
            bull.y += (toY / dist) * chargeSpeed;

            if (Math.abs(toX) > Math.abs(toY)) {
                bull.facing = toX > 0 ? "right" : "left";
            } else {
                bull.facing = toY > 0 ? "down" : "up";
            }

            if (bull.stateTimer <= 0) {

                bull.state = "wander";
                bull.stateTimer = 70 + Math.random() * 50;
            }
        }

        bull.x = Math.max(FIELD.left, Math.min(FIELD.right, bull.x));
        bull.y = Math.max(FIELD.top, Math.min(FIELD.bottom, bull.y));

        let bullClear = keepOutsidePen(bull.x, bull.y, 3);
        bull.x = bullClear.x;
        bull.y = bullClear.y;

        // Bull hits cowboy (the pen is safe ground)

        if (
            cowboy.invulnerable <= 0 &&
            dist < 9 &&
            !isInPen(cowboy.x, cowboy.y)
        ) {

            if (cowboy.carrying) {

                cowboy.carrying.carried = false;
                cowboy.carrying.wanderTimer = 0;
                cowboy.carrying.spookedBull = bull;
                cowboy.carrying.spookedTimer = 70;
                cowboy.carrying = null;
            }

            lives--;
            cowboy.invulnerable = 90;
            shake = 8;

            sfxHit();

            bull.state = "wander";
            bull.stateTimer = 80;

            updateScore();

            if (lives <= 0) {
                endGame();
            }
        }
    }


    // ---- Calves ----

    for (let calf of calves) {

        if (calf.carried) {

            let dir = { x: 0, y: 0 };

            if (cowboy.facing === "left") dir = { x: -1, y: 0 };
            else if (cowboy.facing === "right") dir = { x: 1, y: 0 };
            else if (cowboy.facing === "up") dir = { x: 0, y: -1 };
            else dir = { x: 0, y: 1 };

            calf.x = cowboy.x - dir.x * 10;
            calf.y = cowboy.y - dir.y * 10;
            calf.facing = cowboy.facing;
            continue;
        }

        calf.wanderTimer--;

        // ---- Freshly dropped: sticks near the bull briefly, spooked ----

        if (calf.spookedTimer > 0 && calf.spookedBull) {

            calf.spookedTimer--;

            let bull = calf.spookedBull;
            let toBullX = bull.x - calf.x;
            let toBullY = bull.y - calf.y;
            let distToBull = Math.hypot(toBullX, toBullY) || 1;

            let trailDist = 11;

            if (distToBull > trailDist) {
                calf.vx = (toBullX / distToBull) * 0.35;
                calf.vy = (toBullY / distToBull) * 0.35;
            } else {
                calf.vx = 0;
                calf.vy = 0;
            }

            if (Math.abs(calf.vx) > Math.abs(calf.vy)) {
                calf.facing = calf.vx > 0 ? "right" : "left";
            } else if (calf.vy !== 0) {
                calf.facing = calf.vy > 0 ? "down" : "up";
            }

            if (calf.spookedTimer <= 0) {
                calf.spookedBull = null;
                calf.wanderTimer = 0;
            }

            calf.x += calf.vx;
            calf.y += calf.vy;

            calf.x = Math.max(FIELD.left, Math.min(FIELD.right, calf.x));
            calf.y = Math.max(FIELD.top, Math.min(FIELD.bottom, calf.y));

            continue;
        }

        let toCalfX = calf.x - cowboy.x;
        let toCalfY = calf.y - cowboy.y;
        let distToCowboy = Math.hypot(toCalfX, toCalfY) || 1;

        let fleeRadius = 38;

        if (cowboy.carrying && distToCowboy < fleeRadius) {

            // Spook and run directly away from the cowboy.

            calf.vx = (toCalfX / distToCowboy) * 0.55;
            calf.vy = (toCalfY / distToCowboy) * 0.55;
            calf.wanderTimer = 15;

            if (Math.abs(calf.vx) > Math.abs(calf.vy)) {
                calf.facing = calf.vx > 0 ? "right" : "left";
            } else {
                calf.facing = calf.vy > 0 ? "down" : "up";
            }

        } else if (calf.wanderTimer <= 0) {

            let angle = Math.random() * Math.PI * 2;

            calf.vx = Math.cos(angle) * 0.25;
            calf.vy = Math.sin(angle) * 0.25;
            calf.wanderTimer = 50 + Math.random() * 60;

            if (Math.abs(calf.vx) > Math.abs(calf.vy)) {
                calf.facing = calf.vx > 0 ? "right" : "left";
            } else {
                calf.facing = calf.vy > 0 ? "down" : "up";
            }
        }

        calf.x += calf.vx;
        calf.y += calf.vy;

        calf.x = Math.max(FIELD.left, Math.min(FIELD.right, calf.x));
        calf.y = Math.max(FIELD.top, Math.min(FIELD.bottom, calf.y));
    }


    // ---- Delivery ----

    if (cowboy.carrying && isInPen(cowboy.x, cowboy.y)) {

        score += 10;

        if (score > highScore) {
            highScore = score;
        }

        createPopup(cowboy.x, cowboy.y - 8, "+10");
        createDust(cowboy.x, cowboy.y + 4);
        sfxDeliver();

        let delivered = cowboy.carrying;

        calves = calves.filter(c => c !== delivered);

        let slot = pennedCalves.length;
        let cols = 4;
        let col = slot % cols;
        let row = Math.floor(slot / cols) % 3;

        pennedCalves.push({
            x: PEN.x + 6 + col * 7,
            y: PEN.y + 6 + row * 7,
            animOffset: Math.random() * 4
        });

        cowboy.carrying = null;

        shake = 4;

        updateScore();
    }


    // ---- Win condition: all of this level's calves are home ----

    if (
        calvesSpawned >= levelCalfTotal(level) &&
        calves.length === 0 &&
        !levelComplete
    ) {
        levelComplete = true;
        sfxLevelComplete();
    }


    updateDust();
    updatePopups();

    if (shake > 0) {
        shake--;
    }
}


// -----------------------------------
// DRAW
// -----------------------------------

function draw() {

    ctx.save();

    if (shake > 0) {
        ctx.translate(
            Math.random() * 2 - 1,
            Math.random() * 2 - 1
        );
    }

    drawBackground();
    drawPen();
    drawPennedCalves();
    drawDust();

    for (let calf of calves) {
        if (!calf.carried) {
            drawCalf(calf);
        }
    }

    for (let bull of bulls) {
        drawBull(bull);
    }

    drawCowboy();
    drawLasso();

    if (cowboy.carrying) {
        drawCalf(cowboy.carrying);
    }

    drawPopups();

    ctx.restore();


    // ---- Start screen ----

    if (!gameStarted) {

        ctx.fillStyle = LCD.background;
        ctx.fillRect(18, 30, 124, 56);

        ctx.strokeStyle = LCD.darkest;
        ctx.lineWidth = 2;
        ctx.strokeRect(18, 30, 124, 56);

        ctx.fillStyle = LCD.darkest;
        ctx.font = "9px monospace";
        ctx.textAlign = "center";
        ctx.fillText("SOLAR RODEO", 80, 45);

        ctx.font = "6px monospace";
        ctx.fillText("HERD CALVES HOME", 80, 58);
        ctx.fillText("PRESS START", 80, 68);
        ctx.fillText("TO BEGIN", 80, 77);

        ctx.textAlign = "left";
    }


    // ---- Game over ----

    if (gameOver) {

        ctx.fillStyle = LCD.background;
        ctx.fillRect(16, 30, 128, 58);

        ctx.strokeStyle = LCD.darkest;
        ctx.lineWidth = 2;
        ctx.strokeRect(16, 30, 128, 58);

        ctx.fillStyle = LCD.darkest;
        ctx.font = "10px monospace";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", 80, 46);

        ctx.font = "6px monospace";
        ctx.fillText(
            "SCORE " + String(score).padStart(4, "0"),
            80,
            58
        );
        ctx.fillText("PRESS START", 80, 70);
        ctx.fillText("TO RIDE AGAIN", 80, 79);

        ctx.textAlign = "left";
    }


    // ---- Level complete ----

    if (levelComplete) {

        ctx.fillStyle = LCD.background;
        ctx.fillRect(16, 30, 128, 58);

        ctx.strokeStyle = LCD.darkest;
        ctx.lineWidth = 2;
        ctx.strokeRect(16, 30, 128, 58);

        ctx.fillStyle = LCD.darkest;
        ctx.font = "9px monospace";
        ctx.textAlign = "center";
        ctx.fillText("RODEO WINS!", 80, 46);

        ctx.font = "6px monospace";
        ctx.fillText("LEVEL " + level + " CLEAR", 80, 58);
        ctx.fillText("PRESS START", 80, 70);
        ctx.fillText("FOR LEVEL " + (level + 1), 80, 79);

        ctx.textAlign = "left";
    }


    // ---- Scanlines ----

    ctx.fillStyle = "rgba(62,42,23,0.08)";

    for (let y = 0; y < 120; y += 2) {
        ctx.fillRect(0, y, 160, 1);
    }
}


// -----------------------------------
// MAIN LOOP
// -----------------------------------

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();


// -----------------------------------
// START / RESTART
// -----------------------------------

function pressAction() {

    sfxStart();

    if (gameOver) {

        score = 0;
        lives = 3;
        level = 1;
        calvesSpawned = 0;
        levelComplete = false;

        calves = [];
        bulls = [];
        dust = [];
        popups = [];
        pennedCalves = [];

        cowboy.x = 100;
        cowboy.y = 60;
        cowboy.carrying = null;
        cowboy.invulnerable = 0;
        cowboy.lassoTimer = 0;
        cowboy.idleTimer = 0;

        spawnTimer = 20;

        gameOver = false;
        gameStarted = true;

        updateScore();

        return;
    }

    if (levelComplete) {

        level++;
        calvesSpawned = 0;
        levelComplete = false;

        calves = [];
        bulls = [];
        dust = [];
        popups = [];
        pennedCalves = [];

        cowboy.x = 100;
        cowboy.y = 60;
        cowboy.carrying = null;
        cowboy.invulnerable = 0;
        cowboy.lassoTimer = 0;
        cowboy.idleTimer = 0;

        spawnTimer = 20;

        updateScore();

        return;
    }

    if (!gameStarted) {

        gameStarted = true;
        spawnTimer = 20;

        return;
    }
}


// -----------------------------------
// BUTTONS
// -----------------------------------

document.getElementById("action")
    .addEventListener("pointerdown", pressAction);

document.getElementById("lasso")
    .addEventListener("pointerdown", attemptLasso);


function bindHold(id, key) {

    let el = document.getElementById(id);

    el.addEventListener("pointerdown", () => { keys[key] = true; });
    el.addEventListener("pointerup", () => { keys[key] = false; });
    el.addEventListener("pointerleave", () => { keys[key] = false; });
    el.addEventListener("pointercancel", () => { keys[key] = false; });
}

bindHold("up", "up");
bindHold("down", "down");
bindHold("left", "left");
bindHold("right", "right");


// -----------------------------------
// KEYBOARD
// -----------------------------------

document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowUp") keys.up = true;
    if (event.key === "ArrowDown") keys.down = true;
    if (event.key === "ArrowLeft") keys.left = true;
    if (event.key === "ArrowRight") keys.right = true;

    if (event.key === " ") {
        event.preventDefault();
        attemptLasso();
    }

    if (event.key === "Enter") {
        pressAction();
    }
});

document.addEventListener("keyup", function(event) {

    if (event.key === "ArrowUp") keys.up = false;
    if (event.key === "ArrowDown") keys.down = false;
    if (event.key === "ArrowLeft") keys.left = false;
    if (event.key === "ArrowRight") keys.right = false;
});

</script>
