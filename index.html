<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width,
   initial-scale=1.0,
   maximum-scale=1.0,
   user-scalable=no">

<title>Retro Solar Rodeo</title>

<style>

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
}

body {

    margin: 0;

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #171717;

    font-family: monospace;
}

#console-shell {

    width: 95%;
    max-width: 400px;

    padding: 18px;

    background: #d6b900;

    border: 8px solid #a88f00;

    border-radius: 20px;

    box-shadow:
        0 12px 25px rgba(0,0,0,0.6),
        inset 0 2px rgba(255,255,255,0.3);
}

#solar-panel {

    height: 34px;

    margin-bottom: 12px;

    border: 3px solid #161616;

    background:
        repeating-linear-gradient(
            90deg,
            #29213e 0px,
            #29213e 19px,
            #42365c 20px,
            #42365c 38px
        );
}

#ui-bar {

    display: flex;

    justify-content: space-between;

    padding: 0 5px 5px;

    color: #111;

    font-size: 15px;

    font-weight: bold;
}

#screen-container {

    padding: 5px;

    background: #252525;

    border: 5px solid #111;

    box-shadow:
        inset 0 0 0 2px #555;
}

canvas {

    display: block;

    width: 100%;

    aspect-ratio: 4 / 3;

    background: #9baa91;

    image-rendering: pixelated;
}

#controls {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 0 8px;

    margin-top: 20px;
}

.dpad {

    display: flex;

    flex-direction: column;

    gap: 8px;
}

button {

    border: none;

    color: white;

    font-family: monospace;

    font-weight: bold;

    cursor: pointer;

    touch-action: manipulation;

    background: #333;

    box-shadow: 0 4px #111;
}

button:active {

    transform: translateY(3px);

    box-shadow: 0 1px #111;
}

.btn-move {

    width: 58px;

    height: 45px;

    font-size: 20px;
}

.btn-action {

    width: 82px;

    height: 82px;

    border-radius: 50%;

    background: #b51616;

    box-shadow: 0 5px #720000;
}

#restart-button {

    display: none;

    width: 100%;

    padding: 12px;

    margin-top: 15px;

    background: #333;
}

</style>

</head>

<body>

<div id="console-shell">

```
<div id="solar-panel"></div>

<div id="ui-bar">

    <span>RODEO-51</span>

    <span id="score-display">

<div id="screen-container">

        height="300">

<div id="controls">

    <div class="dpad">

        <button

        </button>

    <button

        id="btn-lasso">

        LASSO

    </button>

</div>


<button id="restart-button">
    RESTART
</button>
```

</div>

<script>


// ======================================
// CANVAS
// ======================================

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");

const scoreDisplay =
    document.getElementById("score-display");

const restartButton =
    document.getElementById("restart-button");


// ======================================
// GAME VARIABLES
// ======================================

let score = 0;

let gameOver = false;

let frame = 0;

let spawnTimer = 0;

let screenShake = 0;


// ======================================
// OLD-SCHOOL LCD COLORS
// ======================================

const LCD_DARK = "#354535";

const LCD_MID = "#536653";

const LCD_LIGHT = "#71806b";

const LCD_BG = "#9baa91";


// ======================================
// LANES
// ======================================

const lanes = [
    35,
    125,
    215
];


// ======================================
// COWBOY
// ======================================

const cowboy = {

    x: 45,

    y: lanes[1],

    lane: 1,

    width: 30,

    height: 55,

    lassoTimer: 0,

    isLassoing: false,

    bounce: 0

};


// ======================================
// COWS
// ======================================

const cows = [];


// ======================================
// PARTICLES
// ======================================

const particles = [];


// ======================================
// SCORE POPUPS
// ======================================

const scorePopups = [];


// ======================================
// BACKGROUND
// ======================================

const clouds = [

    {
        x: 50,
        y: 38,
        speed: 0.15
    },

    {
        x: 220,
        y: 58,
        speed: 0.10
    },

    {
        x: 360,
        y: 30,
        speed: 0.18
    }

];


const cacti = [

    {
        x: 100,
        y: 232
    },

    {
        x: 280,
        y: 240
    },

    {
        x: 390,
        y: 225
    }

];


// ======================================
// PLAYER MOVEMENT
// ======================================

function movePlayer(direction) {

    if (gameOver) return;

    cowboy.lane += direction;

    cowboy.lane =
        Math.max(
            0,
            Math.min(
                2,
                cowboy.lane
            )
        );

    cowboy.y =
        lanes[cowboy.lane];

    cowboy.bounce = 6;
}


// ======================================
// LASSO
// ======================================

function triggerLasso() {

    if (gameOver) return;

    if (!cowboy.isLassoing) {

        cowboy.isLassoing = true;

        cowboy.lassoTimer = 20;

        checkLassoHit();
    }
}


// ======================================
// SPAWN COW
// ======================================

function spawnCow() {

    const lane =
        Math.floor(
            Math.random() * 3
        );

    const difficulty =
        Math.min(
            score / 100,
            5
        );

    cows.push({

        x: canvas.width + 30,

        y: lanes[lane] + 10,

        lane: lane,

        width: 44,

        height: 35,

        speed:
            2.3 +
            Math.random() * 1.4 +
            difficulty * 0.25,

        animation: 0
    });
}


// ======================================
// LASSO COLLISION
// ======================================

function checkLassoHit() {

    const reach = 100;

    for (
        let i = cows.length - 1;
        i >= 0;
        i--
    ) {

        const cow = cows[i];

        if (
            cow.lane !==
            cowboy.lane
        ) {

            continue;
        }

        const cowboyRight =
            cowboy.x +
            cowboy.width;

        const cowCenter =
            cow.x +
            cow.width / 2;

        if (
            cowCenter >
            cowboyRight &&

            cowCenter <
            cowboyRight + reach
        ) {

            cows.splice(i, 1);

            score += 10;

            scoreDisplay.innerText =
                "SCORE: " + score;

            createDust(
                cow.x,
                cow.y + cow.height
            );

            createScorePopup(
                cow.x,
                cow.y
            );

            screenShake = 5;
        }
    }
}


// ======================================
// DUST
// ======================================

function createDust(x, y) {

    for (
        let i = 0;
        i < 6;
        i++
    ) {

        particles.push({

            x: x,

            y: y,

            size:
                2 +
                Math.random() * 3,

            speedX:
                -1 -
                Math.random() * 1.5,

            speedY:
                -Math.random() * 1.5,

            life: 25
        });
    }
}


// ======================================
// SCORE POPUP
// ======================================

function createScorePopup(x, y) {

    scorePopups.push({

        x: x,

        y: y,

        life: 35
    });
}


// ======================================
// UPDATE PARTICLES
// ======================================

function updateParticles() {

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const p = particles[i];

        p.x += p.speedX;

        p.y += p.speedY;

        p.speedY += 0.05;

        p.life--;

        if (p.life <= 0) {

            particles.splice(i, 1);
        }
    }
}


// ======================================
// UPDATE SCORE
// ======================================

function updateScorePopups() {

    for (
        let i =
            scorePopups.length - 1;
        i >= 0;
        i--
    ) {

        const popup =
            scorePopups[i];

        popup.y -= 0.7;

        popup.life--;

        if (popup.life <= 0) {

            scorePopups.splice(i, 1);
        }
    }
}


// ======================================
// UPDATE BACKGROUND
// ======================================

function updateBackground() {

    clouds.forEach(
        cloud => {

            cloud.x -=
                cloud.speed;

            if (
                cloud.x < -60
            ) {

                cloud.x =
                    canvas.width + 60;
            }
        }
    );


    cacti.forEach(
        cactus => {

            cactus.x -= 0.8;

            if (
                cactus.x < -20
            ) {

                cactus.x =
                    canvas.width + 20;
            }
        }
    );
}


// ======================================
// UPDATE GAME
// ======================================

function update() {

    if (gameOver) return;

    frame++;


    // Cowboy animation

    if (cowboy.bounce > 0) {

        cowboy.bounce--;
    }


    // Lasso animation

    if (
        cowboy.isLassoing
    ) {

        cowboy.lassoTimer--;

        if (
            cowboy.lassoTimer <= 0
        ) {

            cowboy.isLassoing =
                false;
        }
    }


    // Cow spawning

    spawnTimer++;

    const spawnRate =
        Math.max(
            50,
            90 -
            Math.floor(
                score / 50
            )
        );


    if (
        spawnTimer >=
        spawnRate
    ) {

        spawnCow();

        spawnTimer = 0;
    }


    // Move cows

    for (
        let i =
            cows.length - 1;
        i >= 0;
        i--
    ) {

        const cow =
            cows[i];

        cow.x -=
            cow.speed;

        cow.animation++;


        if (
            frame % 9 === 0
        ) {

            createDust(
                cow.x + cow.width,
                cow.y + cow.height
            );
        }


        if (
            cow.x +
            cow.width <
            0
        ) {

            gameOver = true;

            restartButton.style.display =
                "block";
        }
    }


    updateParticles();

    updateScorePopups();

    updateBackground();


    if (
        screenShake > 0
    ) {

        screenShake--;
    }
}


// ======================================
// SKY
// ======================================

function drawSky() {

    ctx.fillStyle =
        LCD_BG;

    ctx.fillRect(
        0,
        0,
        400,
        300
    );


    // Sun

    ctx.fillStyle =
        LCD_LIGHT;

    ctx.fillRect(
        320,
        25,
        32,
        32
    );

    ctx.fillRect(
        312,
        33,
        48,
        16
    );


    // Mountains

    ctx.fillStyle =
        LCD_MID;

    ctx.beginPath();

    ctx.moveTo(0, 150);

    ctx.lineTo(65, 80);

    ctx.lineTo(125, 150);

    ctx.lineTo(200, 75);

    ctx.lineTo(275, 150);

    ctx.lineTo(340, 90);

    ctx.lineTo(400, 150);

    ctx.lineTo(400, 180);

    ctx.lineTo(0, 180);

    ctx.closePath();

    ctx.fill();
}


// ======================================
// CLOUDS
// ======================================

function drawClouds() {

    ctx.fillStyle =
        LCD_LIGHT;

    clouds.forEach(
        cloud => {

            ctx.fillRect(
                cloud.x,
                cloud.y,
                42,
                7
            );

            ctx.fillRect(
                cloud.x + 10,
                cloud.y - 5,
                20,
                7
            );
        }
    );
}


// ======================================
// GROUND
// ======================================

function drawGround() {

    ctx.fillStyle =
        "#858d72";

    ctx.fillRect(
        0,
        165,
        400,
        135
    );


    // Horizon

    ctx.fillStyle =
        LCD_DARK;

    ctx.fillRect(
        0,
        164,
        400,
        3
    );


    // Moving ground pixels

    ctx.fillStyle =
        LCD_MID;

    for (
        let x =
            -(frame % 40);
        x < 400;
        x += 40
    ) {

        ctx.fillRect(
            x,
            270,
            18,
            3
        );
    }


    // Small desert pixels

    for (
        let x =
            -(frame % 65);
        x < 400;
        x += 65
    ) {

        ctx.fillRect(
            x,
            205,
            7,
            2
        );

        ctx.fillRect(
            x + 25,
            250,
            5,
            2
        );
    }
}


// ======================================
// CACTI
// ======================================

function drawCacti() {

    ctx.fillStyle =
        LCD_DARK;

    cacti.forEach(
        cactus => {

            ctx.fillRect(
                cactus.x,
                cactus.y,
                7,
                32
            );

            ctx.fillRect(
                cactus.x - 7,
                cactus.y + 9,
                7,
                5
            );

            ctx.fillRect(
                cactus.x + 7,
                cactus.y + 16,
                7,
                5
            );
        }
    );
}


// ======================================
// LANE LINES
// ======================================

function drawLanes() {

    ctx.strokeStyle =
        "rgba(40,50,40,0.18)";

    ctx.lineWidth = 2;

    lanes.forEach(
        y => {

            ctx.beginPath();

            ctx.moveTo(
                0,
                y + 60
            );

            ctx.lineTo(
                400,
                y + 60
            );

            ctx.stroke();
        }
    );
}


// ======================================
// PIXEL COWBOY
// ======================================

function drawCowboy() {

    const walk =
        Math.sin(
            frame * 0.35
        ) * 2;

    const bounce =
        cowboy.bounce > 0
        ? -2
        : 0;

    const x =
        cowboy.x;

    const y =
        cowboy.y +
        bounce;


    // Shadow

    ctx.fillStyle =
        LCD_DARK;

    ctx.fillRect(
        x - 2,
        y + 53,
        32,
        4
    );


    // Back leg

    ctx.fillRect(
        x + 18,
        y + 38 - walk,
        7,
        17
    );


    // Front leg

    ctx.fillRect(
        x + 5,
        y + 38 + walk,
        7,
        17
    );


    // Body

    ctx.fillRect(
        x + 5,
        y + 18,
        22,
        24
    );


    // Arm

    ctx.fillRect(
        x + 23,
        y + 20,
        8,
        7
    );


    // Head

    ctx.fillRect(
        x + 8,
        y + 5,
        17,
        17
    );


    // Ear

    ctx.fillRect(
        x + 23,
        y + 10,
        5,
        5
    );


    // Hat brim

    ctx.fillRect(
        x + 3,
        y + 2,
        27,
        5
    );


    // Hat top

    ctx.fillRect(
        x + 9,
        y - 4,
        15,
        7
    );


    // Face pixel

    ctx.fillStyle =
        LCD_BG;

    ctx.fillRect(
        x + 20,
        y + 11,
        3,
        3
    );
}


// ======================================
// PIXEL COW
// ======================================

function drawCow(cow) {

    /*
       IMPORTANT:

       The cow moves LEFT.

       Therefore the HEAD is on
       the LEFT side.

       This fixes the backwards-running
       cow problem.
    */


    const bob =
        Math.sin(
            cow.animation * 0.20
        ) * 2;

    const leg =
        Math.sin(
            cow.animation * 0.35
        ) * 3;

    const x =
        cow.x;

    const y =
        cow.y + bob;


    // Shadow

    ctx.fillStyle =
        LCD_DARK;

    ctx.fillRect(
        x + 3,
        y + 31,
        39,
        4
    );


    // Back legs

    ctx.fillRect(
        x + 29,
        y + 23 + leg,
        6,
        12
    );


    // Front legs

    ctx.fillRect(
        x + 12,
        y + 23 - leg,
        6,
        12
    );


    // Body

    ctx.fillRect(
        x + 12,
        y + 7,
        27,
        20
    );


    // Neck

    ctx.fillRect(
        x + 7,
        y + 8,
        10,
        17
    );


    // HEAD ON LEFT

    ctx.fillRect(
        x,
        y + 6,
        15,
        18
    );


    // Snout

    ctx.fillRect(
        x - 4,
        y + 14,
        7,
        9
    );


    // Ear

    ctx.fillRect(
        x + 3,
        y + 2,
        7,
        6
    );


    // Horns

    ctx.fillStyle =
        LCD_LIGHT;

    ctx.fillRect(
        x + 2,
        y,
        4,
        5
    );

    ctx.fillRect(
        x + 9,
        y,
        4,
        5
    );


    // Eye

    ctx.fillStyle =
        LCD_BG;

    ctx.fillRect(
        x + 3,
        y + 10,
        3,
        3
    );


    // Tail

    ctx.fillStyle =
        LCD_DARK;

    ctx.fillRect(
        x + 38,
        y + 9,
        7,
        3
    );

    ctx.fillRect(
        x + 43,
        y + 11,
        4,
        6
    );
}


// ======================================
// LASSO
// ======================================

function drawLasso() {

    if (
        !cowboy.isLassoing
    ) {

        return;
    }


    const progress =
        1 -
        cowboy.lassoTimer / 20;


    const radius =
        10 +
        progress * 38;


    const centerX =
        cowboy.x +
        cowboy.width +
        30;


    const centerY =
        cowboy.y + 26;


    ctx.strokeStyle =
        LCD_DARK;

    ctx.lineWidth = 3;


    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        radius,
        0,
        Math.PI * 2
    );

    ctx.stroke();


    // Rope

    ctx.beginPath();

    ctx.moveTo(
        cowboy.x +
        cowboy.width,
        cowboy.y + 26
    );

    ctx.lineTo(
        centerX - radius,
        centerY
    );

    ctx.stroke();
}


// ======================================
// PARTICLES
// ======================================

function drawParticles() {

    ctx.fillStyle =
        LCD_MID;

    particles.forEach(
        p => {

            ctx.fillRect(
                p.x,
                p.y,
                p.size,
                p.size
            );
        }
    );
}


// ======================================
// SCORE
// ======================================

function drawScorePopups() {

    ctx.fillStyle =
        LCD_DARK;

    ctx.font =
        "bold 15px monospace";

    ctx.textAlign =
        "center";

    scorePopups.forEach(
        popup => {

            ctx.fillText(
                "+10",
                popup.x,
                popup.y
            );
        }
    );
}


// ======================================
// GAME OVER
// ======================================

function drawGameOver() {

    if (!gameOver) return;


    ctx.fillStyle =
        "rgba(30,40,30,0.75)";

    ctx.fillRect(
        0,
        0,
        400,
        300
    );


    ctx.fillStyle =
        LCD_BG;

    ctx.textAlign =
        "center";


    ctx.font =
        "bold 27px monospace";

    ctx.fillText(
        "GAME OVER",
        200,
        130
    );


    ctx.font =
        "bold 16px monospace";

    ctx.fillText(
        "SCORE: " + score,
        200,
        160
    );


    ctx.font =
        "12px monospace";

    ctx.fillText(
        "PRESS RESTART",
        200,
        190
    );
}


// ======================================
// SCANLINES
// ======================================

function drawScanlines() {

    /*
       Very subtle horizontal lines
       to make the screen resemble
       an old LCD display.
    */

    ctx.fillStyle =
        "rgba(40,50,40,0.06)";

    for (
        let y = 0;
        y < 300;
        y += 4
    ) {

        ctx.fillRect(
            0,
            y,
            400,
            1
        );
    }
}


// ======================================
// DRAW EVERYTHING
// ======================================

function draw() {

    ctx.save();


    // Screen shake

    if (
        screenShake > 0
    ) {

        const shakeX =
            (Math.random() - 0.5) *
            screenShake;

        const shakeY =
            (Math.random() - 0.5) *
            screenShake;

        ctx.translate(
            shakeX,
            shakeY
        );
    }


    drawSky();

    drawClouds();

    drawGround();

    drawCacti();

    drawLanes();

    drawCowboy();


    cows.forEach(
        cow => {

            drawCow(cow);
        }
    );


    drawLasso();

    drawParticles();

    drawScorePopups();

    drawScanlines();

    drawGameOver();


    ctx.restore();
}


// ======================================
// RESTART
// ======================================

function restartGame() {

    score = 0;

    gameOver = false;

    frame = 0;

    spawnTimer = 0;

    screenShake = 0;


    cows.length = 0;

    particles.length = 0;

    scorePopups.length = 0;


    cowboy.lane = 1;

    cowboy.y =
        lanes[1];

    cowboy.isLassoing =
        false;

    cowboy.lassoTimer = 0;


    scoreDisplay.innerText =
        "SCORE: 0";


    restartButton.style.display =
        "none";
}


// ======================================
// TOUCH BUTTONS
// ======================================

document
    .getElementById("btn-up")
    .addEventListener(
        "touchstart",
        function(e) {

            e.preventDefault();

            movePlayer(-1);
        }
    );


document
    .getElementById("btn-down")
    .addEventListener(
        "touchstart",
        function(e) {

            e.preventDefault();

            movePlayer(1);
        }
    );


document
    .getElementById("btn-lasso")
    .addEventListener(
        "touchstart",
        function(e) {

            e.preventDefault();

            triggerLasso();
        }
    );


// ======================================
// MOUSE BUTTONS
// ======================================

document
    .getElementById("btn-up")
    .addEventListener(
        "mousedown",
        () => movePlayer(-1)
    );


document
    .getElementById("btn-down")
    .addEventListener(
        "mousedown",
        () => movePlayer(1)
    );


document
    .getElementById("btn-lasso")
    .addEventListener(
        "mousedown",
        triggerLasso
    );


// ======================================
// RESTART BUTTON
// ======================================

restartButton.addEventListener(
    "click",
    restartGame
);


// ======================================
// KEYBOARD
// ======================================

window.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key === "ArrowUp"
        ) {

            e.preventDefault();

            movePlayer(-1);
        }


        if (
            e.key === "ArrowDown"
        ) {

            e.preventDefault();

            movePlayer(1);
        }


        if (
            e.key === " " ||
            e.key.toLowerCase() === "x"
        ) {

            e.preventDefault();

            triggerLasso();
        }


        if (
            e.key.toLowerCase() === "r" &&
            gameOver
        ) {

            restartGame();
        }
    }
);


// ======================================
// MAIN LOOP
// ======================================

function loop() {

    update();

    draw();

    requestAnimationFrame(loop);
}


// START

loop();

</script>

</html>
