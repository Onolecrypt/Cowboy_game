<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Retro Solar Rodeo</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        background:
            radial-gradient(circle at 50% 20%, #343d32, #151915 70%);

        font-family: monospace;

        overflow: hidden;
    }

    .console {
        width: min(470px, 96vw);

        padding: 16px;

        background: #d3c64c;

        border: 7px solid #9e9334;

        border-radius: 28px;

        box-shadow:
            0 12px 0 #0d100d,
            inset 0 3px 0 #eee477;

        user-select: none;
    }

    .brand {
        text-align: center;

        color: #36391f;

        font-size: 18px;
        font-weight: bold;

        letter-spacing: 4px;

        margin-bottom: 8px;
    }

    .solar-panel {
        width: 105px;
        height: 27px;

        margin: 0 auto 10px;

        border: 3px solid #292f25;

        background:
            repeating-linear-gradient(
                90deg,
                #26332b 0 11px,
                #536052 11px 13px
            );
    }

    .hud {
        display: flex;
        justify-content: space-between;

        padding: 7px 12px;

        color: #b8c3a9;

        background: #293128;

        border: 4px solid #1c211b;

        border-bottom: 0;

        font-size: 13px;
    }

    .screen {
        position: relative;

        padding: 7px;

        background: #171b17;

        border: 4px solid #111410;
    }

    canvas {
        width: 100%;
        height: auto;

        display: block;

        image-rendering: pixelated;
        image-rendering: crisp-edges;

        background: #9da995;
    }

    .controls {
        display: flex;

        justify-content: space-between;
        align-items: center;

        margin-top: 17px;

        padding: 0 8px;
    }

    .direction-buttons {
        display: flex;
        gap: 12px;
    }

    button {
        font-family: monospace;
        font-weight: bold;

        border: 0;

        cursor: pointer;

        touch-action: manipulation;

        -webkit-tap-highlight-color: transparent;
    }

    .direction {
        width: 57px;
        height: 45px;

        border-radius: 8px;

        color: #ded56e;

        background: #41462d;

        border: 4px solid #292d21;

        box-shadow: 0 5px 0 #24251d;

        font-size: 20px;
    }

    .direction:active {
        transform: translateY(4px);

        box-shadow: 0 1px 0 #24251d;
    }

    .lasso {
        width: 112px;
        height: 58px;

        border-radius: 50%;

        color: white;

        background: #a33c31;

        border: 5px solid #65251e;

        box-shadow: 0 6px 0 #50201b;

        font-size: 14px;
    }

    .lasso:active {
        transform: translateY(5px);

        box-shadow: 0 1px 0 #50201b;
    }

    .hint {
        margin-top: 11px;

        text-align: center;

        color: #4b4928;

        font-size: 9px;

        letter-spacing: 1px;
    }

</style>
</head>

<body>

<div class="console">

    <div class="brand">
        SOLAR RODEO
    </div>

    <div class="solar-panel"></div>

    <div class="hud">

        <span>
            SCORE
            <span id="score">0000</span>
        </span>

        <span>
            HI
            <span id="highScore">0000</span>
        </span>

        <span>
            LV
            <span id="level">01</span>
        </span>

    </div>

    <div class="screen">

        <canvas
            id="game"
            width="200"
            height="150">
        </canvas>

    </div>

    <div class="controls">

        <div class="direction-buttons">

            <button
                class="direction"
                id="up">
                ▲
            </button>

            <button
                class="direction"
                id="down">
                ▼
            </button>

        </div>

        <button
            class="lasso"
            id="lasso">
            LASSO
        </button>

    </div>

    <div class="hint">
        CATCH THE HERD • RIDE THE SUNSET
    </div>

</div>


<script>

/* ==================================================
   RETRO SOLAR RODEO
   PSEUDO-3D ENGINE - FIXED MOVEMENT + LASSO
================================================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;


/* ==================================================
   COLORS
================================================== */

const COLORS = {
    sky: "#9da995",
    skyLight: "#b7c0a5",
    mountain: "#71806c",
    mountainDark: "#5c695a",
    ground: "#aeb79e",
    groundDark: "#7c8974",
    dark: "#3f4e3d",
    darker: "#303c30",
    darkest: "#252f27",
    black: "#1c251e"
};


/* ==================================================
   CANVAS
================================================== */

const WIDTH = 200;
const HEIGHT = 150;

const HORIZON = 50;


/* ==================================================
   GAME STATE
================================================== */

let score = 0;

let highScore =
    Number(localStorage.getItem("solarRodeoHighScore")) || 0;

let level = 1;

let gameStarted = false;

let gameOver = false;

let frame = 0;

let worldSpeed = 0.6;

let spawnTimer = 50;

let shake = 0;


/* ==================================================
   COWBOY
==================================================

   targetLane = where the player wants to go

   lane = actual position

   Because lane is a decimal number, the cowboy
   can smoothly travel between lanes.
================================================== */

const cowboy = {

    targetLane: 1,

    lane: 1,

    x: 100,

    y: 130

};


/* ==================================================
   LANES
================================================== */

const lanePositions = [-1, 0, 1];


/* ==================================================
   OBJECTS
================================================== */

let cows = [];

let dust = [];

let particles = [];

let popups = [];


/* ==================================================
   LASSO STATE
================================================== */

const lasso = {

    active: false,

    timer: 0,

    duration: 26,

    angle: 0,

    radius: 0,

    caughtCow: null

};


/* ==================================================
   HUD
================================================== */

function updateHUD() {

    document.getElementById("score").textContent =
        String(score).padStart(4, "0");

    document.getElementById("highScore").textContent =
        String(highScore).padStart(4, "0");

    document.getElementById("level").textContent =
        String(level).padStart(2, "0");

}

updateHUD();


/* ==================================================
   PIXEL HELPER
================================================== */

function pixel(x, y, w, h, color) {

    ctx.fillStyle = color;

    ctx.fillRect(
        Math.round(x),
        Math.round(y),
        Math.round(w),
        Math.round(h)
    );

}


/* ==================================================
   PERSPECTIVE
================================================== */

function getDepthY(depth) {

    return HORIZON + depth * 100;

}


function getScale(depth) {

    return 0.35 + depth * 0.8;

}


/* ==================================================
   SKY
================================================== */

function drawSky() {

    pixel(
        0,
        0,
        WIDTH,
        HORIZON,
        COLORS.sky
    );


    /* Sun */

    pixel(
        151,
        15,
        15,
        15,
        COLORS.skyLight
    );

    pixel(
        147,
        19,
        23,
        7,
        COLORS.skyLight
    );

    pixel(
        154,
        11,
        8,
        23,
        COLORS.skyLight
    );


    /* Clouds */

    drawCloud(
        25 - (frame * 0.05 % 230),
        16
    );

    drawCloud(
        125 - (frame * 0.025 % 230),
        27
    );

}


/* ==================================================
   CLOUD
================================================== */

function drawCloud(x, y) {

    pixel(
        x,
        y,
        18,
        4,
        COLORS.skyLight
    );

    pixel(
        x + 4,
        y - 3,
        8,
        4,
        COLORS.skyLight
    );

    pixel(
        x + 11,
        y - 2,
        6,
        3,
        COLORS.skyLight
    );

}


/* ==================================================
   MOUNTAINS
================================================== */

function drawMountains() {

    for (
        let x = -40;
        x < WIDTH + 50;
        x += 45
    ) {

        let offset =
            (frame * 0.08) % 45;

        let mx =
            x - offset;


        pixel(
            mx + 14,
            29,
            18,
            15,
            COLORS.mountain
        );

        pixel(
            mx + 7,
            37,
            32,
            10,
            COLORS.mountain
        );

        pixel(
            mx,
            43,
            45,
            5,
            COLORS.mountain
        );

    }

}


/* ==================================================
   GROUND
================================================== */

function drawGround() {

    pixel(
        0,
        HORIZON,
        WIDTH,
        HEIGHT - HORIZON,
        COLORS.ground
    );


    /* Perspective lines */

    for (let i = 0; i < 9; i++) {

        let depth =
            i / 9;

        let y =
            getDepthY(depth);

        pixel(
            0,
            y,
            WIDTH,
            1,
            COLORS.groundDark
        );

    }


    /* Moving desert marks */

    let movement =
        (frame * worldSpeed) % 22;


    for (let i = 0; i < 25; i++) {

        let depth =
            ((i * 0.071) +
            movement / 220) % 1;


        let y =
            getDepthY(depth);


        let x =
            (i * 41 +
            frame * (0.15 + depth)) % WIDTH;


        pixel(
            x,
            y,
            2 + depth * 3,
            1,
            COLORS.groundDark
        );

    }


    /* Perspective lane markers */

    for (let lane = -1; lane <= 1; lane++) {

        for (let i = 0; i < 12; i++) {

            let depth =
                ((i / 12) +
                frame * 0.003) % 1;


            let y =
                getDepthY(depth);


            let x =
                WIDTH / 2 +
                lane * 38 * depth;


            pixel(
                x,
                y,
                1 + depth * 2,
                2 + depth * 2,
                COLORS.groundDark
            );

        }

    }

}


/* ==================================================
   CACTUS
================================================== */

function drawCactus(x, depth) {

    let scale =
        getScale(depth);

    let y =
        getDepthY(depth);


    pixel(
        x,
        y - 14 * scale,
        4 * scale,
        14 * scale,
        COLORS.dark
    );


    pixel(
        x - 4 * scale,
        y - 10 * scale,
        4 * scale,
        3 * scale,
        COLORS.dark
    );

    pixel(
        x - 4 * scale,
        y - 10 * scale,
        3 * scale,
        8 * scale,
        COLORS.dark
    );


    pixel(
        x + 4 * scale,
        y - 7 * scale,
        4 * scale,
        3 * scale,
        COLORS.dark
    );

    pixel(
        x + 5 * scale,
        y - 7 * scale,
        3 * scale,
        7 * scale,
        COLORS.dark
    );

}


/* ==================================================
   WORLD OBJECTS
================================================== */

function drawWorldObjects() {

    for (let i = 0; i < 8; i++) {

        let depth =
            ((i * 0.15) +
            frame * 0.001) % 0.65;


        let x =
            (i * 47 -
            frame * 0.12) % WIDTH;


        if (x < 0) {
            x += WIDTH;
        }


        drawCactus(
            x,
            depth
        );

    }

}


/* ==================================================
   COW
================================================== */

function drawCow(cow) {

    let scale =
        getScale(cow.depth);


    let y =
        getDepthY(cow.depth);


    let x =
        cow.x;


    let animation =
        Math.floor(frame / 5) % 4;


    let bob =
        [0, 1, 0, -1][animation] * scale;


    y += bob;


    /* Shadow */

    pixel(
        x + 2 * scale,
        y,
        20 * scale,
        Math.max(1, 2 * scale),
        COLORS.groundDark
    );


    /* Legs */

    if (animation === 0) {

        pixel(
            x + 4 * scale,
            y - 1 * scale,
            3 * scale,
            8 * scale,
            COLORS.dark
        );

        pixel(
            x + 13 * scale,
            y - 1 * scale,
            3 * scale,
            7 * scale,
            COLORS.dark
        );

    }

    else if (animation === 1) {

        pixel(
            x + 3 * scale,
            y - 1 * scale,
            3 * scale,
            7 * scale,
            COLORS.dark
        );

        pixel(
            x + 14 * scale,
            y - 1 * scale,
            3 * scale,
            8 * scale,
            COLORS.dark
        );

    }

    else if (animation === 2) {

        pixel(
            x + 6 * scale,
            y - 1 * scale,
            3 * scale,
            8 * scale,
            COLORS.dark
        );

        pixel(
            x + 12 * scale,
            y - 1 * scale,
            3 * scale,
            7 * scale,
            COLORS.dark
        );

    }

    else {

        pixel(
            x + 3 * scale,
            y - 1 * scale,
            3 * scale,
            8 * scale,
            COLORS.dark
        );

        pixel(
            x + 13 * scale,
            y - 1 * scale,
            3 * scale,
            7 * scale,
            COLORS.dark
        );

    }


    /* Body */

    pixel(
        x + 3 * scale,
        y - 9 * scale,
        16 * scale,
        9 * scale,
        COLORS.dark
    );


    /* Body highlight */

    pixel(
        x + 7 * scale,
        y - 7 * scale,
        6 * scale,
        2 * scale,
        COLORS.mountainDark
    );


    /* HEAD - LEFT */

    pixel(
        x - 4 * scale,
        y - 8 * scale,
        8 * scale,
        8 * scale,
        COLORS.darkest
    );


    /* Snout */

    pixel(
        x - 7 * scale,
        y - 5 * scale,
        4 * scale,
        4 * scale,
        COLORS.darkest
    );


    /* Ear */

    pixel(
        x - 2 * scale,
        y - 10 * scale,
        4 * scale,
        3 * scale,
        COLORS.dark
    );


    /* Horns */

    pixel(
        x - 5 * scale,
        y - 11 * scale,
        2 * scale,
        5 * scale,
        COLORS.darkest
    );

    pixel(
        x - 2 * scale,
        y - 12 * scale,
        2 * scale,
        4 * scale,
        COLORS.darkest
    );


    /* Eye */

    pixel(
        x - 3 * scale,
        y - 6 * scale,
        Math.max(1, scale),
        Math.max(1, scale),
        COLORS.skyLight
    );


    /* Tail */

    pixel(
        x + 19 * scale,
        y - 8 * scale,
        2 * scale,
        7 * scale,
        COLORS.darkest
    );

    pixel(
        x + 20 * scale,
        y - 2 * scale,
        4 * scale,
        2 * scale,
        COLORS.darkest
    );

}


/* ==================================================
   SPAWN COW
================================================== */

function spawnCow() {

    let lane =
        Math.floor(
            Math.random() * 3
        );


    let depth =
        0.02;


    cows.push({

        lane: lane,

        depth: depth,

        x:
            WIDTH / 2 +
            lanePositions[lane] *
            38 *
            depth,

        speed:
            0.002 +
            level * 0.00035 +
            Math.random() * 0.0006

    });

}


/* ==================================================
   UPDATE COWS
================================================== */

function updateCows() {

    for (
        let i = cows.length - 1;
        i >= 0;
        i--
    ) {

        let cow =
            cows[i];


        cow.depth +=
            cow.speed;


        /*
        Recalculate X using
        perspective.
        */

        cow.x =
            WIDTH / 2 +
            lanePositions[cow.lane] *
            38 *
            cow.depth;


        /*
        Dust only when close enough.
        */

        if (
            cow.depth > 0.25 &&
            frame % 6 === 0
        ) {

            createDust(
                cow.x,
                getDepthY(cow.depth)
            );

        }


        /*
        Cow reaches the player.
        */

        if (
            cow.depth >= 0.95
        ) {

            if (
                cow.lane ===
                Math.round(cowboy.lane)
            ) {

                endGame();

                return;

            }


            cows.splice(i, 1);

        }

    }

}


/* ==================================================
   COWBOY POSITION
================================================== */

function updateCowboy() {

    /*
    Smooth lane movement.

    No teleporting.
    */

    let difference =
        cowboy.targetLane -
        cowboy.lane;


    cowboy.lane +=
        difference * 0.18;


    /*
    Stop tiny floating-point movement.
    */

    if (
        Math.abs(difference) < 0.01
    ) {

        cowboy.lane =
            cowboy.targetLane;

    }


    /*
    Convert lane into screen position.
    */

    cowboy.x =
        WIDTH / 2 +
        (cowboy.lane - 1) * 24;

}


/* ==================================================
   DRAW COWBOY
================================================== */

function drawCowboy() {

    updateCowboy();


    let x =
        cowboy.x;


    /*
    IMPORTANT:

    Cowboy's feet remain at a fixed
    foreground Y position.

    Lane changes ONLY affect X.

    */

    let y =
        cowboy.y;


    /*
    Running animation.
    */

    let animation =
        Math.floor(frame / 6) % 4;


    /*
    Very small natural body movement.

    This prevents the previous
    irregular movement.
    */

    let bob =
        animation === 1 ? 1 : 0;


    y += bob;


    /*
    Shadow
    */

    pixel(
        x - 9,
        y,
        20,
        3,
        COLORS.groundDark
    );


    /*
    LEGS
    */

    if (
        animation === 0 ||
        animation === 2
    ) {

        pixel(
            x - 5,
            y - 14,
            4,
            14,
            COLORS.darkest
        );

        pixel(
            x + 4,
            y - 14,
            4,
            12,
            COLORS.darkest
        );

    }

    else {

        pixel(
            x - 7,
            y - 13,
            4,
            13,
            COLORS.darkest
        );

        pixel(
            x + 5,
            y - 14,
            4,
            14,
            COLORS.darkest
        );

    }


    /*
    BODY
    */

    pixel(
        x - 7,
        y - 28,
        16,
        14,
        COLORS.dark
    );


    /*
    VEST
    */

    pixel(
        x - 3,
        y - 27,
        3,
        11,
        COLORS.darker
    );

    pixel(
        x + 3,
        y - 27,
        3,
        11,
        COLORS.darker
    );


    /*
    BELT
    */

    pixel(
        x - 7,
        y - 17,
        16,
        3,
        COLORS.darkest
    );


    /*
    ARM

    Always reaches toward
    the lasso.
    */

    pixel(
        x + 7,
        y - 25,
        10,
        3,
        COLORS.darkest
    );

    pixel(
        x + 15,
        y - 27,
        3,
        5,
        COLORS.darkest
    );


    /*
    HEAD
    */

    pixel(
        x - 5,
        y - 37,
        11,
        9,
        COLORS.darkest
    );


    /*
    NOSE
    */

    pixel(
        x + 5,
        y - 34,
        4,
        4,
        COLORS.darkest
    );


    /*
    HAT
    */

    pixel(
        x - 9,
        y - 40,
        18,
        4,
        COLORS.darkest
    );

    pixel(
        x - 5,
        y - 44,
        11,
        5,
        COLORS.darkest
    );


    /*
    Hat band
    */

    pixel(
        x - 4,
        y - 40,
        9,
        2,
        COLORS.mountainDark
    );

}


/* ==================================================
   LASSO START
================================================== */

function throwLasso() {

    if (
        !gameStarted
    ) {

        startGame();

        return;

    }


    if (
        gameOver
    ) {

        startGame();

        return;

    }


    /*
    Don't restart an existing throw.
    */

    if (
        lasso.active
    ) {

        return;

    }


    lasso.active = true;

    lasso.timer =
        lasso.duration;

    lasso.angle = 0;

    lasso.radius = 2;

    lasso.caughtCow = null;

}


/* ==================================================
   UPDATE LASSO
================================================== */

function updateLasso() {

    if (
        !lasso.active
    ) {

        return;

    }


    lasso.timer--;


    /*
    Progress:

    0 = beginning

    1 = end
    */

    let progress =
        1 -
        lasso.timer /
        lasso.duration;


    /*
    Lasso grows outward.
    */

    if (
        progress < 0.5
    ) {

        lasso.radius =
            progress * 40;

    }

    else {

        lasso.radius =
            20;

    }


    /*
    Rotation.
    */

    lasso.angle +=
        0.45;


    /*
    Try to catch a cow
    while the loop is fully open.
    */

    if (
        progress > 0.25 &&
        progress < 0.85 &&
        !lasso.caughtCow
    ) {

        checkLassoCollision();

    }


    /*
    End throw.
    */

    if (
        lasso.timer <= 0
    ) {

        lasso.active = false;

        lasso.radius = 0;

    }

}


/* ==================================================
   LASSO COLLISION
================================================== */

function checkLassoCollision() {

    let cowboyX =
        cowboy.x + 17;


    let cowboyY =
        cowboy.y - 25;


    for (
        let i = cows.length - 1;
        i >= 0;
        i--
    ) {

        let cow =
            cows[i];


        /*
        Cow must be close enough.

        Far-away cows cannot be caught.
        */

        if (
            cow.depth < 0.22 ||
            cow.depth > 0.85
        ) {

            continue;

        }


        /*
        Cow must be in the
        cowboy's current lane.

        */

        if (
            cow.lane !==
            Math.round(cowboy.lane)
        ) {

            continue;

        }


        let cowX =
            cow.x;


        let cowY =
            getDepthY(cow.depth);


        let distance =
            Math.sqrt(

                Math.pow(
                    cowX - cowboyX,
                    2
                )

                +

                Math.pow(
                    cowY - cowboyY,
                    2
                )

            );


        /*
        The loop catches
        when the cow enters it.
        */

        if (
            distance <
            lasso.radius + 8
        ) {

            catchCow(
                cow,
                i
            );

            break;

        }

    }

}


/* ==================================================
   CATCH COW
================================================== */

function catchCow(cow, index) {

    if (
        lasso.caughtCow
    ) {

        return;

    }


    lasso.caughtCow =
        cow;


    /*
    Remove from herd.
    */

    cows.splice(
        index,
        1
    );


    /*
    Score.
    */

    score += 10;


    level =
        Math.floor(
            score / 50
        ) + 1;


    worldSpeed =
        0.6 +
        level * 0.08;


    /*
    High score.
    */

    if (
        score > highScore
    ) {

        highScore =
            score;


        localStorage.setItem(
            "solarRodeoHighScore",
            highScore
        );

    }
</script>
</body>
</html>
